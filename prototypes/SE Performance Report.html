/* ===========================================================================
   9. THE SIGNED MATRIX — Annexure I as a two-way document

   The paper form's own Declaration says KCGL provides "training, uniforms, PPE,
   tools and operational support" and the engineer commits to twelve numbers in
   return. A scorecard that only prints the engineer's half is half a document —
   and, worse, it lets a branch hold someone to a commitment it never equipped
   them for. So this sheet prints BOTH columns of that bargain, and then says
   what to do about the difference.
   =========================================================================== */

// What the branch issues. The manager ticks these; nothing counts them.
// [short label, the full thing]. The sheet prints the short one and carries
// the full wording in the tooltip — the checklists are a record, not the point
// of the page, and they were taking a third of it.
const SUPPORT = [
  ['Uniform',                'Uniform issued'],
  ['ID card',                'ID card issued'],
  ['PPE set',                'PPE set — helmet, gloves, safety shoes'],
  ['Tool kit',               'Tool kit issued'],
  ['Measuring instruments',  'Measuring instruments issued'],
  ['eFSR app access',        'Mobile / eFSR app access'],
  ['Travel &amp; conveyance','Travel &amp; conveyance support'],
  ['Coordinator support',    'Coordinator / back-office support'],
];
const COMPLY_SHORT = [
  'Uniform, ID card &amp; PPE worn',
  'Tool kit carried',
  'Machine health check every visit',
  'Promotes parts, battery &amp; AMC',
  'Explains work done to customer',
  'Professional &amp; safe conduct',
  'No repeat complaints',
  'Responds to coordinator',
];

/* Which trainings bear on which commitment.
   The point is not to score the training — it is to tell a SKILL gap from an
   APPLICATION gap from a DISCIPLINE gap, because the three have three
   different answers. An engineer who misses closure and has never been on a
   breakdown course needs a course. One who has been on it needs coaching. One
   who misses first-site reporting needs neither — that is a discipline matter,
   and no training fixes it. `disc` marks those. */
const TRAIN_FOR = {
  sr:      ['LkVA','MkVA','HkVA','Industrial','CPCB','BS V','BSIV','CRDI','Engine','R550','K4300','Power Car','Bio Gas'],
  closure: ['Breakdown','Industrial','CRDI','Engine','R550','K4300','CPCB'],
  wetPm:   ['PM'],
  cdi:     ['Brand Ambassador'],
  spare:   ['Brand Ambassador','KCC'],
  labour:  ['LkVA','MkVA','HkVA','Industrial','CPCB'],
  amcLead: ['Brand Ambassador'],
  battery: ['Inverter','Jump Start','KCC'],
  first:   null, sfTask: null, lms: null, attend: null,     // null = discipline
};

const MONTHS_SHORT = MON;
const fmtTrainDate = d => d ? `${MONTHS_SHORT[+d.slice(5,7)-1]} ${d.slice(0,4)}` : '—';
function tenureOf(uid){
  const h = HIRED[uid];
  if(!h) return null;
  const y = (pdate(state.to) - pdate(h)) / (365.25*86400000);
  return {from:h, years:y, label: y>=1 ? `${y.toFixed(1)} yrs` : `${Math.round(y*12)} mo`};
}

/* ---- the conversation ------------------------------------------------------
   A gap the manager cannot put into a sentence is a gap nobody acts on. So each
   shortfall is turned into three things: what it IS, what it is WORTH, and the
   one thing to ask for. Counts are derived from the engineer's own figures so
   the sentence survives being read out loud in front of him. */
const plain = t => String(t).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
// 'Md Zakir Ali' reads as 'Md Zakir', not 'Md'
const firstName = n => { const w = String(n).split(' '); return w[0].length<=3 && w[1] ? w[0]+' '+w[1] : w[0]; };
const plural = (n, one, many) => `${n} ${n===1?one:(many||one+'s')}`;

function talkFor(k, se, ctx){
  const t = targetFor(k), v = se.v[k.key];
  const gap = Array.isArray(t) ? 0 : Math.max(0, t - v);
  const wk = 4.3 * PMONTHS;                         // weeks in the period
  switch(k.key){
    case 'sr': return {
      short: `${plural(gap,'SR')} short`,
      say: `${iN(v)} SRs closed against ${iN(t)}. ${gap} short — about ${(gap/wk).toFixed(1)} a week.`,
      ask: `Close ${Math.ceil(gap/wk)} more SRs a week.` };
    case 'spare': return {
      short: `₹${iN(gap)} short`,
      say: `Spare parts billed ₹${iN(v)} against ₹${iN(t)}. That is ₹${iN(se.v.sr?v/se.v.sr:0)} of parts attached per SR`
         + (ctx.bSpareSr!=null ? `, where the branch attaches ₹${iN(ctx.bSpareSr)}.` : '.'),
      ask: `Attach ₹${iN(se.v.sr? gap/se.v.sr : gap)} more parts per SR — a filter set or a coolant on the jobs already booked.` };
    case 'labour': return {
      short: `₹${iN(gap)} short`,
      say: `Labour billed ₹${iN(v)} against ₹${iN(t)} — ₹${iN(se.v.sr?v/se.v.sr:0)} a job`
         + (ctx.bLabSr!=null ? ` against the branch's ₹${iN(ctx.bLabSr)}.` : '.'),
      ask: `Bill the full labour line on every job; ₹${iN(gap)} over ${se.v.sr} SRs is ₹${iN(se.v.sr?gap/se.v.sr:gap)} a job.` };
    case 'amcLead': return {
      short: `${plural(gap,'lead')} short`,
      say: `${plural(v,'AMC lead')} against ${t}. On ${se.v.sr} SRs that is one lead every ${se.v.amcLead? Math.round(se.v.sr/se.v.amcLead) : se.v.sr} jobs.`,
      ask: `Raise ${gap} more — one AMC ask on every ${Math.max(1,Math.round(se.v.sr/Math.max(1,t)))}th job covers it.` };
    case 'battery': return {
      short: `${gap} batter${gap===1?'y':'ies'} short`,
      say: `${v} batteries sold against ${t}. Every wet PM is a battery check.`,
      ask: `${gap} more this month — check and quote on the PM visits already scheduled.` };
    case 'lms': return {
      short: `${(100-v).toFixed(1)}% not updated`,
      say: `${v.toFixed(1)}% of leads updated on LMS. The commitment is every one of them.`,
      ask: `Update the same day. An unlogged lead is a lead the branch cannot follow.` };
    case 'first': return {
      short: `${plural(Math.round(se.workDays*(100-v)/100),'day')} late`,
      say: `First site before 10:00 on ${v.toFixed(1)}% of days — roughly ${Math.round(se.workDays*(100-v)/100)} of ${se.workDays} working days started late.`,
      ask: `First call on site by 10:00 every day. Report the exception the evening before, not on the day.` };
    case 'sfTask': return {
      short: `${plural(Math.round(se.v.sr*(100-v)/100),'task')} left open`,
      say: `${v.toFixed(1)}% of tasks closed before leaving site — about ${Math.round(se.v.sr*(100-v)/100)} of ${se.v.sr} tasks left open.`,
      ask: `Close the task on the app before the vehicle moves.` };
    case 'attend': {
      const abs = Math.max(0, se.workDays - se.present);
      return {
        short: `${plural(abs,'day')} absent`,
        say: `Present ${se.present} of ${se.workDays} working days — ${abs} absent. At his own billing that is ₹${iN(ctx.perDay)} a day of work not done.`,
        ask: `Attendance above ${targetFor(COMMITMENTS.find(x=>x.key==='attend'))}% means no more than ${plural(Math.floor(se.workDays*(100-state.targets.attend)/100),'absent day')} in a month.` }; }
    case 'closure': {
      const late = Math.round(se.v.sr*(100-v)/100);
      return {
        short: `${plural(late,'SR')} late`,
        say: `${v.toFixed(1)}% closed inside the timeline against ${t}% — about ${late} of ${se.v.sr} SRs ran past MaxTTR.`,
        ask: `No SR past its timeline. Ask the coordinator to flag anything open on day two.` }; }
    case 'cdi': {
      const c = ctx.cdi;
      return {
        short: `${(t-v).toFixed(1)} pts below`,
        say: `Rated ${v.toFixed(1)} of 10 against ${t}. ${c.D} of ${plural(c.N,'customer')} came back as ${c.D===1?'a detractor':'detractors'} this period`
           + (c.P ? `, ${c.P} as promotors.` : '.'),
        ask: `Explain the work done and the site status before leaving — that one habit moves the rating more than anything else.` }; }
    case 'wetPm': {
      const [lo,hi] = state.targets.wetPm;
      const fast = v < lo;
      return {
        short: fast ? `${(lo-v).toFixed(2)} hrs under` : `${(v-hi).toFixed(2)} hrs over`,   // already a phrase
        say: fast
          ? `Wet PM jobs average ${v.toFixed(2)} hrs against the ${lo}–${hi} hr window — under the time the checklist takes.`
          : `Wet PM jobs average ${v.toFixed(2)} hrs against the ${lo}–${hi} hr window — longer than the job should need.`,
        ask: fast
          ? `Work the full PM checklist. A short PM is what comes back as a breakdown.`
          : `Review the PM sequence with the branch — the time is going somewhere it should not.` }; }
    default: return {short:'—', say:'', ask:''};
  }
}

// The CDI feedback split, struck by the SAME rule the day/week/month report
// uses, so the sheet and the report never quote different numbers.
function cdiSplit(sr, rating){
  const N = Math.max(3, Math.round(sr/4));
  const pSh = Math.max(.06, Math.min(.94, (rating-4.5)/5.5));
  const dSh = (1-pSh)*.45;
  const [P,Pa,D] = spreadInt(N, [pSh, 1-pSh-dSh, dSh]);
  return {P, Pa, D, N};
}

/* ---- the review: everything the sheet asserts is computed here ---------- */
function reviewOf(se){
  const A = k => achieve(k, se.v[k.key]);
  const met  = COMMITMENTS.filter(k=>A(k)>=100);
  const miss = COMMITMENTS.filter(k=>{ const a=A(k); return a!=null && a<85; }).sort((a,b)=>A(a)-A(b));
  const near = COMMITMENTS.filter(k=>{ const a=A(k); return a!=null && a>=85 && a<100; });
  const comply = se.comply.filter(Boolean).length;
  const support = se.support.filter(Boolean).length;
  // the file records a skill once per CATEGORY, so 'BS V' can appear as both
  // Service Expert and Breakdown Expert — one training to a reader, so merge
  // them and name both categories
  const bySkill = new Map();
  (TRAINING[se.uid] || []).forEach(([sk,cat,d])=>{
    const e = bySkill.get(sk);
    if(!e) bySkill.set(sk, {sk, cats:cat?[cat]:[], d});
    else { if(cat && !e.cats.includes(cat)) e.cats.push(cat); if(d > e.d) e.d = d; }
  });
  const tr = [...bySkill.values()].sort((a,b)=> b.d.localeCompare(a.d))
    .map(e=>[e.sk, e.cats.join(' · '), e.d]);
  const skills = tr.map(t=>t[0].toLowerCase());
  const hasTraining = k => {
    const words = TRAIN_FOR[k.key];
    if(words===null || words===undefined) return null;                 // discipline
    return words.some(w=> skills.some(s=> s.includes(w.toLowerCase())));
  };

  const rev = se.v.spare + se.v.labour;
  const perSR = se.v.sr ? rev/se.v.sr : 0;
  const perDay = se.present ? rev/se.present : 0;
  const absent = Math.max(0, se.workDays - se.present);

  // How he sits against the people doing the same job in the same branch —
  // the only fair comparison, and the one he will make himself.
  const peers = SES.filter(x=>x.bid===se.bid && x.uid!==se.uid);
  const pAvg = f => peers.length ? peers.reduce((a,x)=>a+f(x),0)/peers.length : null;
  const branch = {
    n: peers.length + 1,
    rank: SES.filter(x=>x.bid===se.bid).sort((a,b)=>b.score-a.score).findIndex(x=>x.uid===se.uid) + 1,
    sr: pAvg(x=>x.v.sr), score: pAvg(x=>x.score), prod: pAvg(x=>x.v.prod),
    spareSr: pAvg(x=> x.v.sr ? x.v.spare/x.v.sr : 0),
    labSr: pAvg(x=> x.v.sr ? x.v.labour/x.v.sr : 0),
  };
  const ctx = {perSR, perDay, bSpareSr:branch.spareSr, bLabSr:branch.labSr,
               cdi: cdiSplit(se.v.sr, se.v.cdi)};

  // EVERY commitment he is short on, each with what it is worth, what to say
  // and the one thing to ask for. Money is priced at the ENGINEER'S OWN rates,
  // never a branch average: the question is what HE would have billed had he
  // hit the number. Where a gap has no defensible rupee value it carries none
  // rather than an invented one.
  const worthOf = k => {
    const t = targetFor(k), v = se.v[k.key];
    if(k.key==='sr')     return Math.max(0, t-v) * perSR;
    if(k.key==='spare' || k.key==='labour') return Math.max(0, t-v);
    if(k.key==='attend') return absent * perDay;
    return null;
  };
  const stake = COMMITMENTS
    .filter(k=>{ const a=A(k); return a!=null && a<100; })
    .map(k=>({k, pct:A(k), worth:worthOf(k), ...talkFor(k, se, ctx)}))
    .sort((a,b)=> (b.worth||0)-(a.worth||0) || a.pct-b.pct);
  const total = stake.reduce((a,x)=>a+(x.worth||0),0);
  const focus = stake.find(x=>x.worth) || stake[0] || null;

  // The call. Compliance and the support the branch actually gave both weigh on
  // it: an engineer the branch never kitted out is not a performance case.
  let verdict, tone, why;
  const unsupported = SUPPORT.length - support;
  if(unsupported >= 3 && se.score < 80){
    verdict = 'Branch action first';
    tone = 'warn';
    why = `${unsupported} of ${SUPPORT.length} support items are not issued. Close that before the performance conversation — the commitments assume the kit.`;
  } else if(se.score >= 90 && comply === COMPLY.length){
    verdict = 'Recommend — incentive / promotion review';
    tone = 'good';
    why = `${met.length} of ${COMMITMENTS.length} commitments kept and every mandatory item in order.`;
  } else if(se.score >= 80){
    const weakComply = comply <= COMPLY.length - 3;
    verdict = weakComply ? 'On track on the numbers — pull up the mandatory list' : 'On track — confirm';
    tone = weakComply ? 'warn' : 'good';
    why = (miss.length ? `Solid on the numbers; ${miss.length} commitment${miss.length>1?'s':''} to close out.`
                       : 'Every commitment kept.')
      + (weakComply ? ` But only ${comply} of ${COMPLY.length} mandatory items are in order — the score does not cover uniform, PPE, tool kit or workmanship.` : '');
  } else if(se.score >= 70){
    verdict = 'Coach — focused support';
    tone = 'warn';
    why = `Short on ${miss.slice(0,2).map(k=>plain(k.short)).join(' and ')}. Set a 30-day target on ${miss.length>1?'both':'it'}.`;
  } else if(se.score >= 60){
    verdict = 'Formal review';
    tone = 'bad';
    why = `${miss.length} commitments missed by more than 15%. Review with the branch manager this month.`;
  } else {
    verdict = 'Performance improvement plan';
    tone = 'bad';
    why = `Score ${se.score.toFixed(1)} with ${miss.length} commitments missed. Put a written plan and a review date in place.`;
  }

  // Skill gap, application gap or discipline — the three have three answers
  const actions = miss.map(k=>{
    const t = hasTraining(k);
    if(t === null) return {k, type:'Discipline', tone:'bad',
      act:'No training closes this — set the expectation and follow it daily.'};
    if(t) return {k, type:'Application', tone:'warn',
      act:'Trained already — this is coaching and follow-up on site, not another course.'};
    return {k, type:'Skill', tone:'warn', act:'No training on record that covers this — nominate for the next batch.'};
  });

  // If several gaps come back 'Skill', the honest reading is usually that the
  // catalogue has no course for them — it is almost all product training
  // (LkVA, CPCB4+, BS V …) and very little on selling or customer handling.
  // That is a finding about the training plan, not about the engineer.
  const skillGaps = actions.filter(a=>a.type==='Skill').length;
  const catalogue = skillGaps >= 3
    ? `${skillGaps} of these have no course on record that covers them. The Training Report is `
      + `almost entirely product training — worth checking the gap against the training plan `
      + `before nominating him for anything.`
    : null;

  // one line the manager can close the conversation on
  const asks = stake.slice(0,3).map(x=>x.ask);

  return {met, miss, near, comply, support, tr, stake, total, focus, asks, branch,
          rev, perSR, perDay, absent, verdict, tone, why, actions, catalogue,
          tenure:tenureOf(se.uid)};
}

// Inside the matrix every column is already headed by its unit, so the cells
// carry the bare figure — a % or a ₹ on every row of a six-column table is
// noise the reader has to look past.
const bare = t => String(t).replace(/%/g,'').replace(/₹/g,'')
  .replace(/ h$/,'').replace(/ SR\/day/,'').trim();
// the one commitment written as a band rather than a floor
const targetText = k => k.dir==='range'
  ? state.targets[k.key][0] + '–' + state.targets[k.key][1]
  : bare(fmtVal(k, targetFor(k)));

   10. THE PERIOD PICKER AND THE PAGE'S PLUMBING

/* A single-choice dropdown — Group by and Cells. Same chrome, same hover
   behaviour and the same close rules as the multi-selects, so every control in
   the row opens and shuts the same way; only the list is a radio rather than a
   set of ticks. */
const TICK = `<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" `
  + `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.75 6 6 9-13.5"/></svg>`;
function picker(id, key, opts, after, rerender){
  const box = $(id), btn = box.querySelector('.btn'), cnt = box.querySelector('.cnt'),
        list = box.querySelector('.ms-list');
  const lab = ()=>{ const o = opts.find(o=>o.v===state[key]); cnt.textContent = o ? o.label : ''; };
  function paint(){
    list.innerHTML = opts.map(o=>
      `<div class="pick-item${state[key]===o.v?' on':''}" data-v="${o.v}">${TICK}
         <span class="lbl">${o.label}${o.sub?`<span class="sub">${o.sub}</span>`:''}</span></div>`).join('');
    list.querySelectorAll('.pick-item').forEach(el=>{
      el.onclick = ()=>{
        state[key] = el.dataset.v;
        lab(); paint();
        if(after) after();
        drop.close(true);
        (rerender || render)();
      };
    });
  }
  const drop = hoverDrop(box, 'on-open', paint);
  btn.onclick = e=>{
    e.stopPropagation();
    box.classList.contains('on-open') ? drop.close(true) : drop.open();
  };
  box.querySelector('.ms-pop').onclick = e=>e.stopPropagation();
  lab(); paint();
}

/* ---- hover-open plumbing, shared by every dropdown ----------------------
   `openCls` differs per control ('.ms' uses on-open, the period box uses
   open), so the helper takes it. closeAll() is what the outside-click handler
   and every "apply" action call, so a control can never be left hanging. */
const DROPS = [];
function hoverDrop(box, openCls, onOpen){
  let t = null;
  const open = ()=>{
    clearTimeout(t);
    DROPS.forEach(d=>{ if(d.box!==box) d.close(true); });
    box.classList.add(openCls);
    if(onOpen) onOpen();
  };
  const close = (now)=>{
    clearTimeout(t);
    if(now) box.classList.remove(openCls);
    else t = setTimeout(()=>box.classList.remove(openCls), 220);
  };
  box.addEventListener('mouseenter', open);
  box.addEventListener('mouseleave', ()=>close(false));
  DROPS.push({box, open, close});
  return {open, close};
}
const closeAllDrops = ()=> DROPS.forEach(d=>d.close(true));
// renderDetail() rebuilds its own controls each time, so the previous
// registration has to go or the registry grows on every re-render (and every
// hover would try to close a control that no longer exists).
function dropDrop(id){
  for(let i=DROPS.length-1;i>=0;i--)
    if(DROPS[i].box && DROPS[i].box.id===id) DROPS.splice(i,1);
}
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('.ms,.per')) closeAllDrops(); });

});
const perDrop = hoverDrop($('perBox'), 'open');
$('perBtn').onclick = e=>{
  e.stopPropagation();
  $('perBox').classList.contains('open') ? perDrop.close(true) : perDrop.open();
};
$('perBox').querySelector('.per-pop').onclick = e=>e.stopPropagation();
$('pApply').onclick = ()=>{
  if(!$('pFrom').value || !$('pTo').value) return;
  state.from=$('pFrom').value; state.to=$('pTo').value; state.period='custom';
  $('perGrid').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  $('perLbl').textContent='Custom';
  $('perBox').classList.remove('open');
  paintPeriod(); recompute(); render();
};
$('pFrom').value = state.from; $('pTo').value = state.to;
function paintPeriod(){
  $('subPeriod').textContent = `${fmtDay(state.from)} → ${fmtDay(state.to)}`;
}

/* ---- boot ---- */
paintPeriod();
recompute();
render();
</script>
</body>
</html>
