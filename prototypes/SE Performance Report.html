<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kala Care — Service Engineer Performance Commitment Matrix (EPR 7.0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   EPR 7.0 — Employee Productivity rebuilt as the ANNEXURE-I
   "Service Engineer Performance Commitment & Accountability Matrix".

   The old report answered "how much did the engineer do".  This one answers
   "did the engineer keep the 12 commitments he signed", per engineer, with
   a score, a grade and a printable copy of the signed form.

   COLOUR THEME — deliberately NOT a prototype palette.  Every colour below is
   copied from the live application:
     hero / brand ......... #2f3192 -> #23255f   (EmployeeProductivity.jsx)
     grid ................. the --pms-* light-blue ladder (index.css)
     met / near / missed .. --pms-ok / --pms-near / --pms-miss
   The html.dark block re-points the same variables exactly as index.css does,
   so the theme switch shows what the real page looks like in dark mode.
   =========================================================================== */

:root{
  /* ---- app chrome ---- */
  --brand:#2f3192; --brand-d:#23255f;
  --page:#f1f5f9; --card:#ffffff; --ink:#111827; --ink-2:#374151; --muted:#6b7280;
  --edge:#e5e7eb; --edge-2:#d1d5db; --soft:#f9fafb;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --font-sans:'Inter','Segoe UI',Arial,sans-serif;

  /* ---- PMS grid palette (index.css :root) ---- */
  --pms-head:#e8f3fc;
  --pms-row-a:#fbfdff;
  --pms-row-b:#f1f8fe;
  --pms-band-a:#ffffff;
  --pms-band-b:#eaf4fd;
  --pms-grp-a:#f0f8fe;
  --pms-grp-b:#e1effb;
  --pms-subtot:#dcebf9;
  --pms-grptot:#cbe1f5;
  --pms-region:#5e8fc2;
  --pms-grand:#23255f;
  --pms-type:#e4f0fb;
  --pms-sel:#bfdcf7;
  --pms-line:#9fc0df;
  --pms-line-v:#6f9dc9;
  --pms-div:#6e9bc7;
  --pms-typed:#fff9c4;
  --pms-ok:#cdeccd;      --pms-ok-ink:#12401f;
  --pms-near:#fbf0bd;    --pms-near-ink:#4a3c05;
  --pms-miss:#fbd9b5;    --pms-miss-ink:#6b3405;
  --pms-hover:#cbe4fb;
  --pms-edge-shadow:rgba(20,32,28,.22);
}
html.dark{
  --page:#0b1017; --card:#111820; --ink:#e6edf5; --ink-2:#c2ced9; --muted:#8b9bab;
  --edge:#26313d; --edge-2:#33404e; --soft:#131b24;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  --pms-head:#1c2c3e;
  --pms-row-a:#121820;
  --pms-row-b:#17202b;
  --pms-band-a:#0f141a;
  --pms-band-b:#18232f;
  --pms-grp-a:#141d27;
  --pms-grp-b:#1b2733;
  --pms-subtot:#20303f;
  --pms-grptot:#27394b;
  --pms-region:#2f5375;
  --pms-grand:#1b1d4a;
  --pms-type:#182636;
  --pms-sel:#274763;
  --pms-line:#3a4756;
  --pms-line-v:#55697f;
  --pms-div:#4a5a6e;
  --pms-typed:#3b3417;
  --pms-ok:#1d3a24;      --pms-ok-ink:#b7e6bf;
  --pms-near:#3b3413;    --pms-near-ink:#ecd97a;
  --pms-miss:#402612;    --pms-miss-ink:#f0b98a;
  --pms-hover:#26384c;
  --pms-edge-shadow:rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:12px 20px 48px}
@media(max-width:820px){.wrap{padding:10px 10px 32px}}

/* ---------------- hero header (copied from the live page) ---------------- */
.hero{position:relative;border-radius:16px;padding:12px 20px;margin-bottom:12px;color:#fff;
      background:linear-gradient(120deg,var(--brand) 0%,var(--brand-d) 100%)}
.hero .deco{position:absolute;inset:0;overflow:hidden;border-radius:16px;pointer-events:none}
.hero .deco i{position:absolute;border-radius:50%;display:block}
.hero .deco i:nth-child(1){right:-32px;top:-40px;width:128px;height:128px;background:rgba(255,255,255,.07)}
.hero .deco i:nth-child(2){right:64px;bottom:-48px;width:96px;height:96px;background:rgba(255,255,255,.05)}
.hero .row{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.hero .idn{display:flex;align-items:center;gap:10px}
.hero .badge{height:36px;width:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15)}
.hero h1{font-size:19px;font-weight:700;margin:0;line-height:1.2;letter-spacing:-.01em}
.hero .sub{font-size:11px;color:rgba(255,255,255,.72);line-height:1.3;margin-top:1px}
.tmp{display:inline-block;font-size:9px;letter-spacing:.08em;border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:1px 6px;margin-left:8px;vertical-align:2px;font-weight:600}
.hero .acts{display:flex;align-items:center;gap:8px}
.hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;
      padding:7px 11px;font:inherit;font-size:11.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn.on{background:#fff;color:var(--brand-d);border-color:#fff;font-weight:600}

/* period picker */
.per{position:relative}
.per-pop{display:none;position:absolute;right:0;top:calc(100% + 7px);z-index:60;background:var(--card);color:var(--ink);
         border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);padding:12px;width:340px}
.per.open .per-pop{display:block}
.per-pop h4{margin:0 0 7px;font-size:11px;font-weight:700;color:var(--ink-2);text-align:center}
.per-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.per-grid button{border:1px solid var(--edge);background:var(--soft);color:var(--ink-2);border-radius:8px;padding:6px 4px;font:inherit;font-size:11px;font-weight:500;cursor:pointer}
.per-grid button:hover{background:var(--pms-head)}
.per-grid button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.per-cust{display:flex;gap:6px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--edge)}
.per-cust input{flex:1;min-width:0;font:inherit;font-size:11px;padding:6px 7px;border:1px solid var(--edge);border-radius:8px;background:var(--soft);color:var(--ink)}

/* ---- the two dropdowns that are left: the hero's period picker and the
   report's day / week / month picker. Both wear the same chrome. ---- */
.btn{border:1px solid var(--edge-2);background:var(--card);color:var(--ink-2);border-radius:8px;padding:6px 10px;
     font:inherit;font-size:11.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.i{width:14px;height:14px;flex:none;display:inline-block}
.i.sm{width:11px;height:11px;opacity:.7;transition:transform .16s}
.ms.on-open .i.sm{transform:rotate(180deg)}
.per.open .i.sm{transform:rotate(180deg)}

.ms{position:relative}
.ms .cnt{font-size:10.5px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.ms.on-open > .btn{border-color:var(--brand);color:var(--brand)}
.ms-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:var(--card);border:1px solid var(--edge);
        border-radius:11px;box-shadow:var(--shadow);min-width:196px;padding:8px}
.ms.on-open .ms-pop{display:block}
/* an invisible bridge across the gap, so crossing it does not count as leaving */
.ms-pop::before,.per-pop::before{content:'';position:absolute;left:0;right:0;top:-9px;height:9px}
.ms-list{max-height:none;overflow-y:auto}
.pick-item{display:flex;align-items:flex-start;gap:8px;padding:6px 7px;border-radius:7px;cursor:pointer;font-size:11.5px;color:var(--ink-2)}
.pick-item:hover{background:var(--pms-row-b)}
.pick-item.on{background:var(--pms-sel);color:var(--ink);font-weight:600}
.pick-item .tick{width:13px;flex:none;color:var(--brand);opacity:0;margin-top:1px}
.pick-item.on .tick{opacity:1}
html.dark .pick-item.on .tick{color:#9ec5ea}
.pick-item .lbl{flex:1;min-width:0}
.pick-item .sub{display:block;font-size:9.5px;font-weight:400;color:var(--muted);margin-top:1px;white-space:normal;line-height:1.3}

/* ---------------- the explorer card ---------------- */
.panel{background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:11px}
.panel h3{margin:0 0 9px;font-size:12px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
.panel h3 .sm{font-size:10px;font-weight:500;color:var(--muted)}
/* ---------------- performance explorer (the drill-down box) ---------------- */
.pn-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11px;margin-left:auto}
.crumbs button{border:0;background:none;font:inherit;font-size:11px;color:var(--brand);cursor:pointer;padding:2px 5px;border-radius:6px}
.crumbs button:hover{background:var(--pms-row-b)}
.crumbs span{color:var(--muted)}
.crumbs .cur{color:var(--ink);font-weight:600;padding:2px 5px}
.pn-list{max-height:340px;overflow-y:auto;margin:0 -4px;padding:0 4px}
/* the branch board: Maharashtra on the left, Karnataka on the right */
.ex-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 -4px;padding:0 4px;
         align-items:start;max-height:460px;overflow-y:auto}
@media(max-width:860px){.ex-cols{grid-template-columns:1fr;gap:12px}}
.ex-h{display:flex;align-items:baseline;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
      font-weight:800;color:var(--brand-d);padding:0 6px 5px;border-bottom:2px solid var(--pms-div);margin-bottom:3px}
html.dark .ex-h{color:#9ec5ea}
.ex-h span{font-size:9.5px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);margin-left:auto}
.ex-back{border:1px solid var(--edge-2);background:var(--card);color:var(--brand);border-radius:8px;
         padding:4px 10px;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.ex-back:hover{border-color:var(--brand);background:var(--pms-row-b)}

/* ---- the sitemap tree ----------------------------------------------------
   A branch unfolds its engineers underneath it on a connector line, so the
   shape of the org stays on screen while you read one branch of it. */
.pn-row.br{font-weight:600}
.pn-row.br.open{background:var(--pms-band-b)}
.pn-row.se .pn-rank{background:var(--pms-grp-b);font-size:9px}
.pn-go.tw{transition:transform .16s}
.pn-go.tw.open{transform:rotate(90deg);color:var(--brand)}
.ex-kids{position:relative;margin:0 0 5px 12px;padding-left:15px}
.ex-kids::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--pms-line-v);opacity:.55}
.ex-kids > .pn-row{position:relative;border-bottom:0;padding-left:4px}
.ex-kids > .pn-row::before{content:'';position:absolute;left:-15px;top:50%;width:12px;height:1px;
  background:var(--pms-line-v);opacity:.55}
/* the connector stops at the last engineer rather than running past him */
.ex-kids > .pn-row:last-child::after{content:'';position:absolute;left:-15px;top:calc(50% + 1px);
  bottom:-2px;width:1px;background:var(--card)}
.ex-kids > .pn-row .pn-name b{font-weight:500}
.pn-row{display:grid;grid-template-columns:26px 1fr 54px 96px 46px 26px 14px;gap:9px;align-items:center;
        padding:5px 6px;border-radius:8px;font-size:11.5px;color:var(--ink-2);cursor:pointer;
        border-bottom:1px solid var(--edge)}
.pn-row:last-child{border-bottom:0}
.pn-row:hover{background:var(--pms-row-b)}
.pn-row.on{background:var(--pms-sel);color:var(--ink)}
.pn-rank{width:22px;height:20px;border-radius:6px;background:var(--pms-grptot);color:var(--brand-d);
         font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
html.dark .pn-rank{color:#cfe0f0}
.pn-row.top1 .pn-rank{background:var(--pms-ok);color:var(--pms-ok-ink)}
.pn-row.bot1 .pn-rank{background:var(--pms-miss);color:var(--pms-miss-ink)}
.pn-name{min-width:0;overflow:hidden}
.pn-name b{font-weight:600;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-name span{display:block;font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-met{font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pn-bar{height:8px;border-radius:3px;background:var(--pms-row-b);border:1px solid var(--pms-line);overflow:hidden;position:relative}
.pn-bar i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:2px}
.pn-score{text-align:right;font-weight:800;font-size:11px;font-variant-numeric:tabular-nums}
.pn-go{width:12px;height:12px;color:var(--muted)}
.pn-empty{font-size:11.5px;color:var(--muted);padding:14px 6px;text-align:center}

/* ---------------- engineer detail (day / week / month + charts) ------------ */
.detail{margin-top:12px;background:var(--card);border:1px solid var(--edge);border-radius:14px;
        box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:16px}
.detail[hidden]{display:none}
.dt-top{background:linear-gradient(120deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;
        padding:11px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.dt-id h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.dt-id p{margin:1px 0 0;font-size:10.5px;color:rgba(255,255,255,.72)}
/* an id is read digit by digit — it needs the contrast the prose around it does not */
.dt-id p b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dt-kpis{display:flex;gap:16px;margin-left:auto;align-items:center}
.dt-k{text-align:right}
.dt-k .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.6);font-weight:700}
.dt-k .v{font-size:17px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.dt-body{padding:12px 14px 16px}
.dt-empty{padding:34px 20px;text-align:center;color:var(--muted)}
.dt-empty svg{width:34px;height:34px;color:var(--pms-line-v);margin-bottom:8px}
.dt-empty b{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:3px}
.dt-empty span{font-size:11.5px}
.dt-bar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:11px}
.dt-scope{font-size:10.5px;color:var(--muted)}
/* The breakdown is TRANSPOSED: the periods run left to right across the head,
   the metrics run top to bottom down the frozen first column, and the period
   total is frozen against the right edge so it is readable at any scroll. */
/* The breakdown scrolls sideways, often a long way — so the bar is mirrored
   ABOVE the table as well: on a 31-day view the bottom bar is off the far end
   of the screen by the time you need it. Bar and table share ONE frame, so the
   two can never drift out of line and their borders cannot double up. */
.dt-frame{border:1px solid var(--pms-line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.dt-topbar{overflow-x:auto;overflow-y:hidden;height:9px;background:var(--soft);
           border-bottom:1px solid var(--pms-line)}
.dt-topbar.hide{display:none}
.dt-topbar > div{height:1px}
/* The breakdown is its own scroll box — which is exactly what lets the header
   row and the metric column stay put while you read across 31 days and down
   through the bifurcations. */
.dt-tblbox{overflow:auto;max-height:62vh}
table.dt-t thead th{position:sticky;top:0;z-index:5}
table.dt-t thead th.m{z-index:8}
table.dt-t thead th.tot{z-index:7}
table.dt-t thead th.m.tot{z-index:9}
/* one thin bar everywhere the page scrolls */
.dt-topbar,.dt-tblbox,.ex-cols,.ms-list,.pn-list{scrollbar-width:thin;scrollbar-color:var(--pms-line-v) transparent}
.dt-topbar::-webkit-scrollbar,.dt-tblbox::-webkit-scrollbar,
.ex-cols::-webkit-scrollbar,.ms-list::-webkit-scrollbar,.pn-list::-webkit-scrollbar{width:6px;height:6px}
.dt-topbar::-webkit-scrollbar-thumb,.dt-tblbox::-webkit-scrollbar-thumb,
.ex-cols::-webkit-scrollbar-thumb,.ms-list::-webkit-scrollbar-thumb,.pn-list::-webkit-scrollbar-thumb{
  background:var(--pms-line-v);border-radius:6px}
.dt-topbar::-webkit-scrollbar-track,.dt-tblbox::-webkit-scrollbar-track,
.ex-cols::-webkit-scrollbar-track,.ms-list::-webkit-scrollbar-track,.pn-list::-webkit-scrollbar-track{background:transparent}
table.dt-t{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.dt-t th,table.dt-t td{padding:5px 7px;font-size:10.5px;white-space:nowrap;
      box-shadow:inset -1px 0 0 var(--pms-line),inset 0 -1px 0 var(--pms-line)}
table.dt-t thead th{background:var(--pms-head);color:var(--ink-2);font-size:9px;font-weight:700;
      text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.25;min-width:52px}
table.dt-t thead th b{display:block;font-size:10px;letter-spacing:0;color:var(--ink)}
table.dt-t thead th span{display:block;font-size:8.5px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
table.dt-t th.m{position:sticky;left:0;z-index:4;text-align:left;width:186px;min-width:186px;
      background:var(--pms-band-b);color:var(--ink);font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;
      box-shadow:inset -1px 0 0 var(--pms-div),inset 0 -1px 0 var(--pms-line),3px 0 6px -3px var(--pms-edge-shadow)}
table.dt-t thead th.m{background:var(--pms-head);z-index:6}
/* label and unit share one line, so eleven rows do not cost twenty-two lines
   of height for nothing */
table.dt-t th.m em{font-style:normal;font-size:9px;font-weight:400;color:var(--muted);margin-left:6px;white-space:nowrap}
table.dt-t th.m em::before{content:'·';margin-right:6px;opacity:.6}
table.dt-t td{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);background:var(--pms-row-a)}
table.dt-t tbody tr:nth-child(even) td{background:var(--pms-row-b)}
table.dt-t tbody tr:hover td{background:var(--pms-hover)}
table.dt-t tbody tr:hover th.m{background:var(--pms-sel)}
table.dt-t td.off,table.dt-t th.off{background:var(--pms-band-b);color:var(--muted)}
table.dt-t .tot{position:sticky;right:0;z-index:5;background:var(--pms-subtot) !important;
      font-weight:800;color:var(--ink);
      box-shadow:inset 1px 0 0 var(--pms-div),inset 0 -1px 0 var(--pms-line),-3px 0 6px -3px var(--pms-edge-shadow)}
table.dt-t thead th.tot{background:var(--pms-grptot) !important;z-index:7}
table.dt-t thead th.cur{background:var(--pms-sel)}

/* ---- charts ---------------------------------------------------------------
   Palette: the data-viz reference instance, validated against THIS card's
   surface (#ffffff light, #111820 dark) — all six checks pass in both modes.
   Aqua is sub-3:1 on the light surface, which obliges relief: the breakdown
   table above the charts is that relief, and every line also carries a direct
   end label. Text never wears a series colour. */
:root{
  --viz-1:#2a78d6; --viz-2:#eb6834; --viz-3:#1baf7a;
  --viz-ink:#111827; --viz-mut:#6b7280; --viz-grid:#e5e7eb; --viz-base:#c3c2b7; --viz-surf:#ffffff;
  --viz-ok:#0ca30c; --viz-warn:#fab219; --viz-bad:#d03b3b;
}
html.dark{
  --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70;
  --viz-ink:#e6edf5; --viz-mut:#8b9bab; --viz-grid:#26313d; --viz-base:#383835; --viz-surf:#111820;
}
/* ---- expandable breakdown rows ---- */
table.dt-t th.m{display:table-cell}
table.dt-t th.m > span{display:inline-block;vertical-align:middle}
table.dt-t tr.par.has th.m{cursor:pointer}
table.dt-t tr.par.has th.m:hover{background:var(--pms-sel)}
.dtc{width:10px;height:10px;color:var(--brand);transition:transform .16s;margin-right:5px;vertical-align:middle}
.dtc.open{transform:rotate(90deg)}
table.dt-t tr.kid th.m{padding-left:28px;background:var(--pms-grp-a);font-weight:400;font-size:10.5px;color:var(--ink-2)}
table.dt-t tr.kid td{background:var(--pms-grp-a);font-size:10px;color:var(--ink-2)}
table.dt-t tr.kid td.tot{background:var(--pms-grptot) !important;font-weight:700}
table.dt-t tr.kid:hover td,table.dt-t tr.kid:hover th.m{background:var(--pms-hover)}
table.dt-t td.mid{text-align:center}
.pa-p{color:var(--pms-ok-ink);font-weight:800}
.pa-a{color:var(--pms-miss-ink);font-weight:800}
.pa-o{color:var(--muted);opacity:.5}

/* ---- the short summary ---- */
.sm-box{border:1px solid var(--edge);border-radius:11px;background:var(--soft);padding:11px 13px;margin-bottom:14px}
.sm-box h4{margin:0 0 9px;font-size:11.5px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.sm-box h4 span{font-size:10px;font-weight:500;color:var(--muted)}
.sm-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}
@media(max-width:760px){.sm-tiles{grid-template-columns:repeat(2,1fr)}}
.sm-t{background:var(--card);border:1px solid var(--edge);border-radius:9px;padding:7px 10px}
.sm-t .l{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sm-t .v{display:block;font-size:17px;font-weight:800;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.sm-t .h{display:block;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-say{margin:0;padding-left:16px;font-size:11.5px;line-height:1.65;color:var(--ink-2)}
.sm-say li{margin-bottom:1px}
.sm-say b{color:var(--ink);font-weight:600}

.dt-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.dt-charts{grid-template-columns:1fr}}
.ch{margin:0;border:1px solid var(--edge);border-radius:11px;padding:9px 11px 6px;background:var(--card);min-width:0}
.ch figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:6px}
.ch-t{font-size:11.5px;font-weight:700;color:var(--ink)}
.ch-s{font-size:9.5px;color:var(--muted)}
.ch-lg{display:flex;flex-wrap:wrap;gap:9px;margin-left:auto;font-size:9.5px;color:var(--ink-2)}
.ch-lg span{display:inline-flex;align-items:center;gap:4px}
.ch-lg i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.ch svg{display:block;width:100%;height:auto}
.ch svg text{font-family:var(--font-sans)}
.ch-none{font-size:10.5px;color:var(--muted);padding:16px 0;text-align:center}
footer{margin-top:14px;font-size:10.5px;color:var(--muted);text-align:center}

/* ---------------- engineer scorecard modal (the printable Annexure-I) ----- */
.mask{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,16,24,.55);backdrop-filter:blur(2px);
      align-items:flex-start;justify-content:center;padding:14px;overflow:hidden}
.mask.open{display:flex}
/* the signed matrix fills the screen and sits at the top; the two short panels
   are centred, where a short dialogue belongs */
.mask.mid{align-items:center}
.mask.mid .sheet{max-width:660px}
/* The sheet owns the height and its BODY does the scrolling, so the title bar
   stays put instead of scrolling away from the numbers it names. */
.sheet{background:#fff;color:#111827;width:100%;max-width:1040px;border-radius:14px;
       box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;
       max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.sheet .sh-top{background:linear-gradient(120deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;
       padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.sheet .sh-top h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.sheet .sh-top .s2{font-size:10.5px;color:rgba(255,255,255,.75);margin-top:1px}
.sh-x{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.sh-x:hover{background:rgba(255,255,255,.26)}
.sh-body{padding:12px 18px 20px;overflow-y:auto;flex:1 1 auto;min-height:0;
         scrollbar-width:thin;scrollbar-color:var(--pms-line-v) transparent}
.sh-body::-webkit-scrollbar{width:6px}
.sh-body::-webkit-scrollbar-thumb{background:var(--pms-line-v);border-radius:6px}
.sh-body::-webkit-scrollbar-track{background:transparent}
.sh-id{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:640px){.sh-id{grid-template-columns:repeat(2,1fr)}}
.sh-id .f{border:1px solid var(--pms-line);border-radius:8px;padding:5px 8px;background:#f7fbff}
.sh-id .f .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;font-weight:700}
.sh-id .f .v{font-size:12px;font-weight:600;color:#111827;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-h{font-size:11.5px;font-weight:700;color:#111827;margin:12px 0 6px;padding-bottom:4px;border-bottom:1.5px solid #111827;display:flex;justify-content:space-between;align-items:baseline}
.sh-h span{font-size:10px;font-weight:500;color:#6b7280}
table.sh-t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
table.sh-t th,table.sh-t td{border:1px solid #9fc0df;padding:5px 7px;vertical-align:middle;
  overflow-wrap:break-word;word-break:normal}
/* table-layout:fixed reads its widths from the FIRST row, so they are declared
   on the colgroup rather than on the tds — otherwise all six columns come out
   equal and the KPI text paints over the Commitment column. */
table.sh-t col.w-n{width:30px}
table.sh-t col.w-c{width:118px}
table.sh-t col.w-a{width:100px}
table.sh-t col.w-p{width:54px}
table.sh-t col.w-s{width:64px}
table.sh-t th{background:#e8f3fc;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#374151;text-align:center}
table.sh-t td.n{text-align:center;color:#6b7280;font-variant-numeric:tabular-nums}
table.sh-t td.k{text-align:left;line-height:1.3}
table.sh-t td.c{text-align:center;color:#374151;line-height:1.3}
table.sh-t td.a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
table.sh-t td.p{text-align:right;font-variant-numeric:tabular-nums}
table.sh-t td.s{text-align:center;font-size:9px;font-weight:700;letter-spacing:.04em}
.sh-ok{background:#cdeccd;color:#12401f}
.sh-near{background:#fbf0bd;color:#4a3c05}
.sh-miss{background:#fbd9b5;color:#6b3405}
/* ---- the two-way document ---- */
.sh-id{grid-template-columns:repeat(3,1fr)}
@media(min-width:720px){.sh-id{grid-template-columns:repeat(6,1fr)}}
.sh-id .f .v .vs{display:block;font-size:9px;font-weight:400;color:#6b7280;margin-top:1px}
.sh-verdict{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
     border:1px solid #9fc0df;border-left-width:5px;border-radius:10px;padding:11px 15px;margin-bottom:4px;background:#f7fbff}
.sh-verdict.v-good{border-left-color:#0ca30c}
.sh-verdict.v-warn{border-left-color:#fab219}
.sh-verdict.v-bad{border-left-color:#d03b3b}
@media(max-width:760px){.sh-verdict{grid-template-columns:1fr}}
.sh-verdict .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:#6b7280;font-weight:700}
.sh-verdict .sc{text-align:center;padding-right:16px;border-right:1px solid #9fc0df}
@media(max-width:760px){.sh-verdict .sc{border-right:0;border-bottom:1px solid #9fc0df;padding:0 0 8px;text-align:left}}
.sh-verdict .big{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sh-verdict .big span{font-size:14px}
.sh-verdict .h{font-size:14px;font-weight:700;color:#111827;margin-top:1px}
.sh-verdict .w{font-size:11px;color:#374151;margin-top:2px;line-height:1.5}
.sh-verdict .vm{font-size:10.5px;color:#374151;line-height:1.65;white-space:nowrap}
.sh-verdict .vm b{font-weight:700;color:#111827}
.sh-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:760px){.sh-2col{grid-template-columns:1fr;gap:4px}}
.sh-sub{font-size:10px;font-weight:700;color:#374151;margin:2px 0 5px;display:flex;gap:7px;align-items:baseline}
.sh-sub em{font-style:normal;font-weight:400;font-size:9.5px;color:#6b7280}
.sh-note{font-size:10.5px;color:#374151;background:#f7fbff;border:1px solid #9fc0df;border-radius:8px;padding:6px 9px;margin-top:6px}
.sh-note b{color:#111827}
table.sh-t .sub2{font-size:9px;color:#6b7280;margin-top:1px;font-weight:400}
table.sh-t.stake td.k{text-align:left}
table.sh-t.stake td.a{width:104px}
table.sh-t.stake tr.tot td{background:#e8f3fc;font-weight:800;color:#111827}
table.sh-t.act td.g{width:88px;text-align:center}
table.sh-t.act td.k{text-align:left;font-size:10.5px}
.tag{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
     border-radius:4px;padding:2px 6px}
.tag.t-good{background:#cdeccd;color:#12401f}
.tag.t-warn{background:#fbf0bd;color:#4a3c05}
.tag.t-bad{background:#fbd9b5;color:#6b3405}
.sh-none{font-size:10.5px;color:#6b7280;padding:9px 2px;font-style:italic}

/* ---- the conversation: a headline, then one card per gap ---- */
.sh-lede{display:flex;align-items:center;gap:16px;background:#f7fbff;border:1px solid #9fc0df;
         border-radius:10px;padding:10px 15px;margin-bottom:9px}
.sh-lede .ld-n{font-size:26px;font-weight:800;line-height:1;color:#6b3405;font-variant-numeric:tabular-nums;flex:none}
.sh-lede .ld-t{font-size:11px;color:#374151;line-height:1.55}
.sh-lede b{color:#111827;font-weight:700}
.gaps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:820px){.gaps{grid-template-columns:1fr}}
.gap{border:1px solid #9fc0df;border-radius:9px;padding:7px 10px 8px;background:#fff;break-inside:avoid}
.gap .gh{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.gap .gn{width:17px;height:17px;border-radius:5px;background:#e8f3fc;color:#23255f;font-size:9.5px;
         font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.gap .gt{font-size:11px;font-weight:700;color:#111827;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gap .gs{font-size:9.5px;color:#6b7280;margin-left:auto;white-space:nowrap;flex:none}
.gap .gw{font-size:11.5px;font-weight:800;color:#6b3405;font-variant-numeric:tabular-nums;flex:none;min-width:56px;text-align:right}
.gap .gb{font-size:10.5px;color:#374151;line-height:1.5}
.gap .ga{font-size:10.5px;color:#111827;line-height:1.5;margin-top:3px;padding-top:3px;border-top:1px dashed #cfe0f0}
.gap .ga b{color:#23255f}
.sh-ask{font-size:10.5px;color:#374151;line-height:1.6;background:#eef7ee;border:1px solid #b7d9b7;
        border-radius:9px;padding:8px 11px;margin-top:9px}
.sh-ask b{color:#12401f}

/* ---- the tick lists: a record, kept compact ---- */
.chk{font-size:10.5px}
.chk.two{columns:2;column-gap:26px}
@media(max-width:640px){.chk.two{columns:1}}
.chk.two label{break-inside:avoid}
.chk.big{font-size:11.5px}
.chk.big label{padding:4px 0}
.chk.big input{width:15px;height:15px}
.chk label em{font-style:normal;font-size:9.5px;color:#6b7280;margin-left:5px}
.chk label{display:flex;gap:6px;align-items:center;padding:1.5px 0;color:#374151;cursor:pointer;line-height:1.35}
.chk label:hover{color:#111827}
.chk input{accent-color:#2f3192;width:13px;height:13px;flex:none;cursor:pointer}
.chk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk.train label{cursor:default}
.chk.train input{accent-color:#0ca30c}
.chk.train b{margin-left:auto;font-size:9px;color:#6b7280;font-weight:600;flex:none;padding-left:8px}

.sh-set{font-size:10px;color:#6b7280;margin:-3px 0 7px;display:flex;align-items:center;gap:5px}
.sh-set b{color:#2f3192;font-weight:600}
.sh-decl{font-size:10.5px;color:#374151;line-height:1.65;background:#f7fbff;border:1px solid #9fc0df;border-radius:8px;padding:9px 11px;margin-top:6px}
.sh-score{display:flex;align-items:center;gap:12px;background:#f7fbff;border:1px solid #9fc0df;border-radius:10px;padding:9px 13px;margin-bottom:4px}
.sh-score .big{font-size:27px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sh-score .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;font-weight:700}
.sh-score .gcell{margin-left:auto;text-align:right}

@media print{
  /* The breakdown is wide by nature — a month is 31 columns — so the report
     prints landscape and shrinks its own type rather than losing the right
     hand side of the table off the page. */
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff}
  /* two print modes: the signed matrix (default) and the engineer's report */
  .wrap,.hero,.bar,.card,.panel,footer{display:none !important}
  body.print-detail .wrap{display:block !important}
  body.print-detail .wrap > *{display:none !important}
  body.print-detail .detail{display:block !important;border:0;box-shadow:none;margin:0}
  body.print-detail .mask{display:none !important}
  body.print-detail .dt-top .sh-x,body.print-detail .dt-topbar{display:none !important}
  body.print-detail .dt-frame{overflow:visible}
  body.print-detail .dt-tblbox{max-height:none;overflow:visible;border-radius:10px}
  body.print-detail table.dt-t{width:100%;min-width:0;table-layout:fixed}
  body.print-detail table.dt-t th,body.print-detail table.dt-t td{
    padding:2px 3px;font-size:6.5pt;position:static}
  body.print-detail table.dt-t th.m{width:96px;min-width:96px;max-width:96px;font-size:7pt;white-space:normal}
  body.print-detail table.dt-t thead th{font-size:5.8pt;line-height:1.15}
  body.print-detail table.dt-t thead th b{font-size:6.2pt}
  body.print-detail .dt-charts{grid-template-columns:1fr 1fr}
  body.print-detail .ch,body.print-detail .gap,body.print-detail .sm-box,
  body.print-detail tr{break-inside:avoid}
  .mask{display:block !important;position:static;background:none;padding:0;backdrop-filter:none}
  .sheet{max-width:none;box-shadow:none;border-radius:0;max-height:none;display:block}
  .sh-body{overflow:visible}
  .sh-x{display:none}
  .sheet .sh-top{background:#23255f !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
</style>

<script>
/* ===========================================================================
   1. THE COMMITMENT MODEL — Annexure I, transcribed
   =========================================================================== */

// dir: 'min'   -> at or above target is 100%
//      'range' -> inside [lo,hi] is 100%, outside falls away proportionally
// agg: how a branch / region / grand-total row rolls its engineers up
const KPIS = [
  {no:1,  key:'sr', perMonth:true,      name:'CSP/PW BD/CM together Min SR Count', short:'SR Count',        head:'SR Count',        unit:'nos',  fmt:'int',  target:60,      dir:'min',  commit:'Minimum 60 SR’s',       hint:'UW / Bandhan / PM / CM / BD', agg:'sum', sec:'vol',
   src:'Response Time &amp; MaxTTR (SR close date) split by the SR Type Master (MaxTTR)', ready:'live', note:'Counted today as Close SR; the commitment needs only the 5 heads summed instead of all of them.'},
  // --- reference columns, NOT commitments ---------------------------------
  // Annexure I has 12 commitments and the score has to stay those 12, so these
  // two carry info:true: no target, no met/near/missed paint, no weight, and no
  // row on the printed matrix. They still roll up and sort like any column.
  {no:null, sortNo:1.5, key:'prod', name:'Productivity — SR Close per Day Present', short:'Productivity',
   head:'Product-<br>ivity', unit:'SR / day', fmt:'rate2', target:null, dir:null,
   commit:'SR ÷ days present', hint:'closed SRs per day worked', agg:'derived', sec:'vol', info:true,
   derive:v => (v.present ? v.sr / v.present : 0),
   src:'Close SR ÷ days marked present', ready:'derive',
   note:'Days present comes from the attendance marks, so there is no second paid-days figure to disagree with it. Computed at every level from that level’s OWN totals — a branch is its total SRs over its total days present, never the average of its engineers’ rates.'},

  {no:2,  key:'spare', perMonth:true,   name:'Spare Parts Sales / Month',          short:'Spare Sales',     head:'Spare Sales',     unit:'₹', fmt:'amt', target:150000,  dir:'min',  commit:'Minimum ₹1,50,000',     hint:'part revenue booked by the engineer', agg:'sum', sec:'rev',
   src:'LMS Part Invoice Amount (already the “Spare Conv. Amount” column) / Part Sale file', ready:'derive', note:'Live for LEAD-driven spares. Counter sales from the Part Sale file carry no SR number, so an engineer link has to be built through Instance ID + date.'},
  {no:3,  key:'labour', perMonth:true,  name:'Labour Revenue Generation / Month',  short:'Labour Rev.',     head:'Labour Rev.',     unit:'₹', fmt:'amt', target:60000,   dir:'min',  commit:'Minimum ₹60,000',       hint:'labour value on SRs closed', agg:'sum', sec:'rev',
   src:'Labour Revenue Detailed Report → SR NUMBER → MaxTTR SE NAME', ready:'derive', note:'The labour file has SR NUMBER and MaxTTR maps that SR to an engineer — exactly the join the report used before 2026-08.'},

// deterministic PRNG — the sheet must never reshuffle between renders
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1103515245+12345)>>>0; return (s>>>8)/0xFFFFFF; }; }
const pick = (r,lo,hi,step) => { const v = lo + r()*(hi-lo); return step ? Math.round(v/step)*step : v; };
// a "100% or nothing" commitment (LMS update, first-site, task closure) is met
// outright often enough in real life that the demo has to show both outcomes
const pctVal = (r,lo,hitChance) => r() < hitChance ? 100 : +pick(r,lo,99.4).toFixed(1);

// `base` is ONE MONTH of this engineer. The period figures (`se.v`) are built
// from it by recompute() whenever the reporting period changes — see periodOf.
const SES = RAW_SE.map(([bid,name,uid,ticket,srCount],i)=>{
  const r = rng(+uid*7919 + i*13);
  const br = BRANCHES.find(b=>b.id===bid);
  const row = {
    uid, name, bid, code:ticket || uid, region:br.region, grp:br.grp,
    branch:br.name,
    base:{
      sr:      srCount,
      spare:   pick(r,20000,340000,5000),
      labour:  pick(r,8000,165000,2000),
      amcLead: Math.round(pick(r,0,12)),
      battery: Math.round(pick(r,0,9)),
      lms:     pctVal(r,46,.34),
      first:   pctVal(r,50,.30),
      sfTask:  pctVal(r,55,.32),
      attend:  +pick(r,62,100).toFixed(1),
      closure: +pick(r,60,100).toFixed(1),
      cdi:     +pick(r,5.2,10).toFixed(1),
      wetPm:   +pick(r,0.7,2.9).toFixed(2),
    },
    // avg first-site arrival, shown on the printable matrix under KPI 6
    firstAvg: (()=>{ const m = Math.round(pick(r,530,650)); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); })(),
    comply: COMPLY.map(()=> r() > .16),
    // what the branch has issued him — the other half of the declaration
    support: Array.from({length:8}, ()=> r() > .13),
  };
  row.base.prod = 0;                   // set per period by recompute()
  row.v = row.base;                    // replaced by recompute() at boot
  return row;
});

/* ---- the period ------------------------------------------------------------
   PMONTHS is how many months the selected period is worth — 1.00 for a month,
   3.00 for a quarter, 12.00 for a financial year, and a fraction for anything
   clipped. Every per-month commitment is multiplied by it. */
let PMONTHS = 1;
const daysBetween = (a,b) => Math.round((pdate(b)-pdate(a))/86400000) + 1;
const monthDays = (y,m) => new Date(y, m+1, 0).getDate();
const sundaysIn = (y,m) => { let n=0, d=monthDays(y,m);
  for(let k=1;k<=d;k++) if(new Date(y,m,k).getDay()===0) n++; return n; };

// The months the period touches, each with the fraction of it that falls inside
function periodSpan(){
  const out = [];
  let d = pdate(state.from);
  d = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = pdate(state.to);
  while(d <= end && out.length < 60){
    const y = d.getFullYear(), m = d.getMonth(), dim = monthDays(y,m);
    const a = isoOf(new Date(y,m,1)) > state.from ? isoOf(new Date(y,m,1)) : state.from;
    const b = isoOf(new Date(y,m,dim)) < state.to ? isoOf(new Date(y,m,dim)) : state.to;
    const over = daysBetween(a,b);
    if(over > 0) out.push({y, m, dim, from:a, to:b, days:over, f:over/dim,
                           sun:(()=>{ let n=0; for(let k=pdate(a).getDate(); k<=pdate(b).getDate(); k++)
                                        if(new Date(y,m,k).getDay()===0) n++; return n; })()});
    d = new Date(y, m+1, 1);
  }
  return out;
}

// One engineer's figures FOR THE PERIOD. Counts and money scale with the months;
// rates and ratings are carried across as they are; working days and days
// present are counted off the calendar — every day but Sunday is a working day.
function periodOf(se){
  const span = periodSpan();
  const months = span.reduce((a,x)=>a+x.f, 0) || 1;
  const days = span.reduce((a,x)=>a+x.days, 0) || 1;
  const b = se.base;
  const work = span.reduce((a,x)=>a + (x.days - x.sun), 0);
  const present = Math.min(work, Math.round(work * b.attend/100));
  const v = {
    sr:      Math.round(b.sr * months),
    spare:   b.spare * months,
    labour:  b.labour * months,
    amcLead: Math.round(b.amcLead * months),
    battery: Math.round(b.battery * months),
    lms:b.lms, first:b.first, sfTask:b.sfTask, closure:b.closure, cdi:b.cdi, wetPm:b.wetPm,
    attend:  work ? +(present/work*100).toFixed(1) : 0,
    present,                                   // the productivity denominator
  };
  v.prod = +(present ? v.sr/present : 0).toFixed(2);
  return {v, months, days, work, present};
}

// Called at boot and on every period change: nothing on the page is scored
// against a commitment that has not been resolved to the period first.
function recompute(){
  PMONTHS = periodSpan().reduce((a,x)=>a+x.f, 0) || 1;
  SES.forEach(se=>{
    const P = periodOf(se);
    se.v = P.v; se.workDays = P.work; se.present = P.present; se.periodDays = P.days;
    se.score = scoreOf(se); se.grade = gradeOf(se.score);
  });
}

   3. SCORING
   =========================================================================== */

const state = {
  openBr:new Set(),         // the branches unfolded in the explorer
  drill:[],                 // the explorer's path, e.g. ['1','420435_3']
  openSe:null,              // the engineer whose detail report is open
  gran:'day',               // that report's granularity: day | week | month
  dtOpen:new Set(),         // which breakdown rows are opened into their parts
  targets:Object.fromEntries(KPIS.map(k=>[k.key, Array.isArray(k.target)?k.target.slice():k.target])),
  weights:Object.fromEntries(KPIS.map(k=>[k.key,1])),
  period:'last_month', from:'2026-07-01', to:'2026-07-31',
};

// achievement of one value against its (possibly edited) commitment
// The commitment AS IT APPLIES TO THE SELECTED PERIOD. 60 SRs a month is 180
// over a quarter; 95% within timeline is 95% however long you look.
function targetFor(k){
  const t = state.targets[k.key];
  return k.perMonth ? t * PMONTHS : t;
}
function achieve(k, v){
  if(k.info) return null;                    // a reference column has no target
  if(v===null || v===undefined || !isFinite(v)) return null;
  const t = targetFor(k);
  if(k.dir==='range'){
    const [lo,hi] = t;
    if(v>=lo && v<=hi) return 100;
    return v<lo ? (lo? v/lo*100 : 0) : (v? hi/v*100 : 0);
  }
  return t ? v/t*100 : 0;
}
const statusOf = p => p===null ? 'na' : (p>=100 ? 'ok' : (p>=85 ? 'near' : 'miss'));

function scoreOf(row){
  let num=0, den=0;
  for(const k of COMMITMENTS){
    const w = +state.weights[k.key] || 0;
    if(!w) continue;
    const p = achieve(k, row.v[k.key]);
    if(p===null) continue;
    num += Math.min(100,p) * w; den += w;
  }
  return den ? +(num/den).toFixed(1) : 0;
}
const gradeOf = s => s>=90?'A' : s>=80?'B' : s>=70?'C' : s>=60?'D' : 'E';


// roll a set of engineers into one row: counts sum, percentages average
function rollup(list){
  const v = {};
  for(const k of KPIS){
    if(k.agg==='derived') continue;                 // second pass, below
    if(!list.length){ v[k.key]=null; continue; }
    if(k.agg==='sum') v[k.key] = list.reduce((a,s)=>a+s.v[k.key],0);
    else v[k.key] = +(list.reduce((a,s)=>a+s.v[k.key],0)/list.length).toFixed(2);
  }
  // A RATIO is recomputed from this level's own totals — a branch's
  // productivity is its SRs over its paid days, never the mean of its
  // engineers' rates, which would weight a 6-SR engineer like a 100-SR one.
  for(const k of KPIS){
    if(k.agg!=='derived') continue;
    v[k.key] = list.length ? +k.derive(v).toFixed(2) : null;
  }
  const score = list.length ? +(list.reduce((a,s)=>a+s.score,0)/list.length).toFixed(1) : 0;
  return {v, score, grade:gradeOf(score), n:list.length,
          workDays:list.reduce((a,s)=>a+s.workDays,0), present:list.reduce((a,s)=>a+s.present,0)};
}

/* ===========================================================================
   4. FORMATTING
   =========================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = v => Math.round(v).toLocaleString('en-IN');
// The FULL figure with its unit — tooltips, the CSV and the printed matrix all
// have room for it.
function fmtVal(k, v){
  if(v===null || v===undefined || v===0) return '–';
  switch(k.fmt){
    case 'amt':  return '₹'+inr(v);
    case 'pct':  return v.toFixed(1)+'%';
    case 'rate': return v.toFixed(1);
    case 'rate2':return trim2(v)+' SR/day';
    case 'hrs':  return v.toFixed(2)+' h';
    default:     return Math.round(v).toLocaleString('en-IN');
  }
}
function fmtTarget(k){
  const t = targetFor(k);
  if(k.dir==='range') return t[0].toFixed(1)+'–'+t[1].toFixed(1)+' h';
  return fmtVal(k, +t);
}
const fmtPct = p => p===null ? '–' : (p>=999 ? '999+' : p.toFixed(0)+'%');
const fmtDay = s => new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'});

// One row of the tree — a branch or an engineer. Same shape either way, so the

function exRow(o){

function renderPanel(list){
  const box = $('pnList');
  box.className = 'ex-cols';
  const open = state.openBr.size > 0;
  $('pnHint').textContent = open
    ? 'click an engineer for the full report'
    : 'click a branch to unfold its service engineers';
  $('crumbs').innerHTML =
    `<button class="ex-back" id="exAll">${open ? 'Collapse all' : 'Expand all branches'}</button>`;
  $('exAll').onclick = ()=>{
    if(open) state.openBr.clear();
    else BRANCHES.forEach(b=> list.some(x=>x.bid===b.id) && state.openBr.add(b.id));
    renderPanel(visibleSes());
  };

  box.innerHTML = ['MH','KA'].map(rg=>{
    const bs = BRANCHES.filter(b=>b.region===rg)
      .map(b=>({b, mem:list.filter(s=>s.bid===b.id)}))
      .filter(x=>x.mem.length)
      .map(x=>({...x, r:rollup(x.mem)}))
      .sort((a,b)=>b.r.score-a.r.score);
    const rows = bs.length ? bs.map((x,i)=>{
      const isOpen = state.openBr.has(x.b.id);
      let h = exRow({
        key:x.b.id, kind:'br', open:isOpen, rank:i+1, name:x.b.name,
        sub:`${x.b.id} · ${x.mem.length} engineer${x.mem.length>1?'s':''}`,
        met:COMMITMENTS.filter(c=>achieve(c,x.r.v[c.key])>=100).length,
        score:x.r.score, grade:x.r.grade,
      });
      if(isOpen){
        const mem = x.mem.slice().sort((a,b)=>b.score-a.score);
        h += `<div class="ex-kids">` + mem.map((se,j)=> exRow({
          key:se.uid, kind:'se', rank:j+1, name:se.name,
          sub:`UID ${se.uid} · code ${esc(se.code)}`,
          met:COMMITMENTS.filter(k=>achieve(k,se.v[k.key])>=100).length,
          score:se.score, grade:se.grade,
          cls:(state.openSe===se.uid ? ' on' : '')
              + (mem.length>4 ? (j===0 ? ' top1' : (j===mem.length-1 ? ' bot1' : '')) : ''),
        })).join('') + `</div>`;
      }
      return h;
    }).join('') : '<div class="pn-empty">No branch matches the filters.</div>';
    return `<div><div class="ex-h">${RG_NAME[rg]}
        <span>${bs.length} branch${bs.length===1?'':'es'} · ${bs.reduce((a,x)=>a+x.mem.length,0)} engineers</span>
      </div>${rows}</div>`;
  }).join('');

  box.querySelectorAll('.pn-row').forEach(el=>{
    el.onclick = e=>{
      e.stopPropagation();
      if(el.dataset.kind==='se'){ openDetail(el.dataset.k); return; }
      const k = el.dataset.k;
      state.openBr.has(k) ? state.openBr.delete(k) : state.openBr.add(k);
      renderPanel(visibleSes());
    };
  });
}

/* ===========================================================================
   8. THE ENGINEER DETAIL REPORT — day / week / month, with charts
   =========================================================================== */
const MSD = 86400000;
const pdate = d => new Date(d+'T00:00:00');
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD = (s,n)=>{ const d=pdate(s); d.setDate(d.getDate()+n); return isoOf(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Spread a total across weighted slots so the parts add back to the whole —
// the drill-down must reconcile with the row it came from, to the unit.
function spreadInt(total, w){
  const sum = w.reduce((a,b)=>a+b,0) || 1;
  const raw = w.map(x=>total*x/sum), out = raw.map(Math.floor);
  let rem = Math.round(total) - out.reduce((a,b)=>a+b,0);
  const order = raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]);
  for(let i=0;i<rem;i++) out[order[i%order.length][1]]++;
  return out;
}
const spreadNum = (total, w)=>{ const sum=w.reduce((a,b)=>a+b,0)||1; return w.map(x=>total*x/sum); };

// A percentage / rating varies day to day around the engineer's own figure. The
// deviations are made to sum to zero and are kept inside the headroom, so no
// value ever needs clamping and the mean stays exactly the period figure.
function wobble(base, n, r, cap){
  const head = Math.min(base, cap-base) * .55;
  const d = Array.from({length:n}, ()=> (r()-.5)*2*head);
  const mean = d.reduce((a,b)=>a+b,0)/n;
  return d.map(x=> base + x - mean);
}

// ---- the day buckets of the selected reporting period ----------------------
function dayBuckets(se){
  const days = [];
  for(let d=state.from; d<=state.to && days.length<400; d=addD(d,1)) days.push(d);
  const n = days.length, r = rng(+se.uid*31 + 17);
  // Sunday carries a token load, not none: emergency call-outs happen
  const w = days.map(d=> pdate(d).getDay()===0 ? .07 : .55 + r()*1.0);
  const sr = spreadInt(se.v.sr, w);
  const spare = spreadNum(se.v.spare, w), labour = spreadNum(se.v.labour, w);
  const leads = spreadInt(se.v.amcLead, w), batt = spreadInt(se.v.battery, w);
  const closure = wobble(se.v.closure,n,r,100), first = wobble(se.v.first,n,r,100),
        cdi = wobble(se.v.cdi,n,r,10);
  // ---- working days, and the P / A mark on each of them --------------------
  // EVERY day the branch works is marked: the engineer was either present (P)
  // or he was not (A). Only a Sunday carries a dash, because only a Sunday is
  // not a working day. The percentage is then the marks' own ratio rather than
  // a second, disagreeing number.
  const work = days.map(d=> pdate(d).getDay()===0 ? 0 : 1);
  const wantWork = work.reduce((a,b)=>a+b,0);
  const pres = work.slice();
  const order = [...days.keys()].sort((a,b)=> ((a*2246822519)%101) - ((b*2246822519)%101));
  let absent = wantWork - Math.max(0, Math.min(wantWork, Math.round(wantWork * se.v.attend/100)));
  for(const i of order){ if(absent<=0) break; if(pres[i]){ pres[i]=0; absent--; } }
  return bifurcate(se, days.map((d,i)=>({
    key:d, label:pdate(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),
    sub:pdate(d).toLocaleDateString('en-GB',{weekday:'short'}),
    off: pdate(d).getDay()===0,
    sr:sr[i], spare:spare[i], labour:labour[i], leads:leads[i], batt:batt[i],
    work:work[i], pres:pres[i],
    attend: work[i] ? pres[i]*100 : se.v.attend,
    closure:closure[i], first:first[i], cdi:cdi[i], days:1,
  })));
}

// ---- roll the days up into calendar weeks (Mon–Sun) ------------------------
function weekBuckets(se){
  const days = dayBuckets(se), out = [];
  days.forEach(d=>{
    const dow = (pdate(d.key).getDay()+6)%7;                 // Mon = 0
    const ws = addD(d.key, -dow);
    let b = out[out.length-1];
    if(!b || b.ws!==ws){
      b = {ws, key:ws, label:'W'+(out.length+1), sub:'', sr:0,spare:0,labour:0,leads:0,batt:0,
           work:0,pres:0, attend:0,closure:0,first:0,cdi:0,days:0};
      out.push(b);
    }
    ['sr','spare','labour','leads','batt','work','pres'].forEach(k=> b[k]+=d[k]);
    ['closure','first','cdi'].forEach(k=> b[k]+=d[k]);
    b.days++; b.end = d.key;
  });
  out.forEach(b=>{
    ['closure','first','cdi'].forEach(k=> b[k]/=b.days);
    b.attend = b.work ? b.pres/b.work*100 : 0;
    // the first and last week of a period are CLIPPED to it, so the label has
    // to show the days actually counted — not the Monday before the period began
    const st = b.ws < state.from ? state.from : b.ws;
    b.sub = `${pdate(st).getDate()}–${pdate(b.end).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}`;
  });
  return bifurcate(se, out);
}

// ---- a trailing twelve months, so the trend has somewhere to run -----------
// The month the reporting period sits in carries the engineer's REAL figures;
// the eleven before it are generated around them, deterministically.
// The raw monthly series — N months ending at the reporting period's last
// month. Month, quarter and year views are all built from this one series, so
// a quarter is always exactly the three months printed beside it.
function rawMonths(se, N){
  const end = pdate(state.to), out = [], r = rng(+se.uid*7919 + 3);
  for(let i=N-1;i>=0;i--){
    const d = new Date(end.getFullYear(), end.getMonth()-i, 1);
    const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const f = i===0 ? 1 : .62 + r()*.72;
    out.push({
      key:isoOf(d), label:MON[d.getMonth()], sub:String(d.getFullYear()).slice(2),
      cur:i===0, days:dim,
      sr:Math.round(se.base.sr*f),
      spare:se.base.spare*f, labour:se.base.labour*f,
      leads:Math.round(se.base.amcLead*f), batt:Math.round(se.base.battery*f),
      attend:Math.min(100, se.base.attend*(i===0?1:.9+r()*.2)),
      closure:Math.min(100, se.base.closure*(i===0?1:.88+r()*.24)),
      first:Math.min(100, se.base.first*(i===0?1:.88+r()*.24)),
      cdi:Math.min(10, se.base.cdi*(i===0?1:.9+r()*.2)),
    });
    // every day but Sunday is a working day; presence is marked on those
    const m = out[out.length-1];
    m.work = dim - sundaysIn(d.getFullYear(), d.getMonth());
    m.pres = Math.round(m.work * m.attend/100);
    m.attend = m.work ? m.pres/m.work*100 : 0;
  }
  return out;
}

function monthBuckets(se){
  // a period longer than a month IS the window; a single month gets the
  // trailing twelve so the trend has somewhere to run
  const span = periodSpan();
  const out = rawMonths(se, Math.max(12, span.length));
  const keep = span.length > 1
    ? out.filter(m=> span.some(x=> x.y===pdate(m.key).getFullYear() && x.m===pdate(m.key).getMonth()))
    : out.slice(-12);
  return bifurcate(se, keep.length ? keep : out.slice(-12));
}
// ---- the dimensions every metric bifurcates on -----------------------------
// SR TYPE comes from the 'SR Type Master (MaxTTR)' heads the report already
// uses; the part categories are the Part Sale file's own PART CATEGORY.
const SR_TYPES = ['Warranty','PW','AMC','KOEL AMC','CSP','Others'];
const PART_CATS = ['Filters','Battery','Coolant','K-Oil','DEF','Spares','Others'];

// An engineer's job mix is a PROPERTY OF THE ENGINEER, not noise: the same
// shares apply to every bucket, so the mix reads as a profile down the row.
function mixOf(seed, n){
  const r = rng(seed), w = Array.from({length:n}, ()=> .18 + r()*1.0);
  const s = w.reduce((a,b)=>a+b,0);
  return w.map(x=>x/s);
}
// deviations that come to zero under the mix's own weights, so the parts
// weight-average back to the whole and nothing needs clamping
function devFor(mix, base, r, cap){
  const head = Math.min(base, cap-base) * .5;
  const d = mix.map(()=> (r()-.5)*2*head);
  const m = d.reduce((a,x,i)=>a+x*mix[i], 0);
  return d.map(x=>x-m);
}

// Every bucket carries its own bifurcations, so a metric can be opened at any
// granularity without regenerating anything.
function bifurcate(se, B){
  const srMix = mixOf(+se.uid*13+1, SR_TYPES.length);
  const partMix = mixOf(+se.uid*13+2, PART_CATS.length);
  const labMix = mixOf(+se.uid*13+3, SR_TYPES.length);
  const closeDev = devFor(srMix, se.v.closure, rng(+se.uid*13+4), 100);
  B.forEach(b=>{
    b.srBy = {}; b.labourBy = {}; b.spareBy = {}; b.closeBy = {};
    const srSplit = spreadInt(b.sr, srMix);
    SR_TYPES.forEach((t,i)=>{
      b.srBy[t] = srSplit[i];
      b.labourBy[t] = b.labour * labMix[i];
      b.closeBy[t] = Math.max(0, Math.min(100, b.closure + closeDev[i]));
    });
    PART_CATS.forEach((c,i)=>{ b.spareBy[c] = b.spare * partMix[i]; });
  });
  // ---- CDI feedback ---------------------------------------------------------
  // The split follows the rating — a 9/10 engineer collects promotors, a 6/10
  // one collects detractors — but it is struck ONCE over the whole period and
  // then spread across the buckets. Struck per bucket it degenerates: a day
  // carries one feedback, and one feedback always lands in whichever share is
  // largest, so a 7.4 engineer would show promotors only.
  const nAll = Math.max(3, Math.round(B.reduce((a,b)=>a+b.sr,0)/4));
  const rate = B.reduce((a,b)=>a+b.cdi*b.days,0) / (B.reduce((a,b)=>a+b.days,0)||1);
  const pSh = Math.max(.06, Math.min(.94, (rate-4.5)/5.5));
  const dSh = (1-pSh)*.45;
  const [Pall, PaAll, Dall] = spreadInt(nAll, [pSh, 1-pSh-dSh, dSh]);
  const w = B.map(b=> b.sr + .35);                    // feedback follows the load
  const pB = spreadInt(Pall, w), paB = spreadInt(PaAll, w), dB = spreadInt(Dall, w);
  B.forEach((b,i)=>{ b.cdiP = pB[i]; b.cdiPa = paB[i]; b.cdiD = dB[i]; b.cdiN = pB[i]+paB[i]+dB[i]; });
  return B;
}

/* ---- the breakdown's ROWS --------------------------------------------------
   Periods run across the head; these run down the side. A row with `kids`
   opens on its own chevron into the bifurcation underneath it. */
const iN = v => Math.round(v).toLocaleString('en-IN');
const iL = v => (v/1e5).toFixed(2);
const i1 = v => v.toFixed(1);
const trim2 = v => Number.isInteger(+v.toFixed(2)) ? String(+v.toFixed(2)) : v.toFixed(2);
// '0', '0.0', '0.00', '0%' — a formatted nothing, whatever the formatter made
// of it. A compound cell like '0 / 5' is left alone: that zero is half a fact.
const dashZero = t => /^0(\.0+)?%?$/.test(String(t).replace(/<[^>]*>/g,'').trim()) ? '–' : t;
const sumB = (B,f)=> B.reduce((a,b)=>a+f(b),0);
const wavgB = (B,f)=>{ const d=B.reduce((a,b)=>a+b.days,0)||1; return B.reduce((a,b)=>a+f(b)*b.days,0)/d; };
// a per-SR-type closure averages under that type's OWN load, not under the days
const srwB = (B,f,t)=>{ const n=sumB(B,b=>b.srBy[t]); return n? B.reduce((a,b)=>a+f(b)*b.srBy[t],0)/n : null; };

const DT_ROWS = [
  {id:'sr', lab:'SR closed', u:'count', mid:true, val:b=>b.sr, f:iN, tot:B=>iN(sumB(B,b=>b.sr)),
   kids:()=>SR_TYPES.map(t=>({lab:t, u:'count', mid:true, val:b=>b.srBy[t], f:iN,
     tot:B=>iN(sumB(B,b=>b.srBy[t]))}))},

  // no paid-days row: the attendance marks below already carry it
  // 2.00 SRs a day is 2 SRs a day — the decimals are only worth printing when
  // there are decimals
  {id:'prod', lab:'Productivity', u:'SR / day', val:b=> b.pres? b.sr/b.pres : null, f:trim2,
   tot:B=>{ const p=sumB(B,b=>b.pres); return p? trim2(sumB(B,b=>b.sr)/p) : '–'; }},

  {id:'spare', lab:'Spare parts sales', u:'₹ Lakh', val:b=>b.spare, f:iL, tot:B=>iL(sumB(B,b=>b.spare)),
   kids:()=>PART_CATS.map(c=>({lab:c, u:'₹ Lakh', val:b=>b.spareBy[c], f:iL, tot:B=>iL(sumB(B,b=>b.spareBy[c]))}))},

  {id:'labour', lab:'Labour revenue', u:'₹ Lakh', val:b=>b.labour, f:iL, tot:B=>iL(sumB(B,b=>b.labour)),
   kids:()=>SR_TYPES.map(t=>({lab:t, u:'₹ Lakh', val:b=>b.labourBy[t], f:iL, tot:B=>iL(sumB(B,b=>b.labourBy[t]))}))},

  {id:'leads', lab:'AMC leads', u:'count', mid:true, val:b=>b.leads, f:v=>String(Math.round(v)), tot:B=>String(sumB(B,b=>b.leads))},
  {id:'batt', lab:'Battery sold', u:'count', mid:true, val:b=>b.batt, f:v=>String(Math.round(v)), tot:B=>String(sumB(B,b=>b.batt))},

  // Attendance is MARKED, not measured — a day is P or A, and it needs no
  // bifurcation because the mark IS the whole of it. The period column carries
  // what the marks come to: the percentage present.
  {id:'attend', lab:'Attendance', u:'P / A', mid:true,
   cell:b=> state.gran==='day'
     ? (b.work ? (b.pres ? '<span class="pa-p">P</span>' : '<span class="pa-a">A</span>')
               : '<span class="pa-o">–</span>')
     : `<span class="pa-p">${b.pres}</span><span class="pa-o"> / </span><span class="pa-a">${b.work-b.pres}</span>`,
   tot:B=>{ const p=sumB(B,b=>b.pres), w=sumB(B,b=>b.work); return w ? i1(p/w*100)+'%' : '–'; }},

  {id:'closure', lab:'SR / eFSR closure', u:'%', val:b=>b.closure, f:i1, tot:B=>i1(wavgB(B,b=>b.closure)),
   kids:()=>SR_TYPES.map(t=>({lab:t, u:'%', val:b=> b.srBy[t]? b.closeBy[t] : null, f:i1,
     tot:B=>{ const v=srwB(B,b=>b.closeBy[t],t); return v==null?'–':i1(v); }}))},

  {id:'first', lab:'First site before 10:00', u:'%', val:b=>b.first, f:i1, tot:B=>i1(wavgB(B,b=>b.first))},

  // CDI: the rating on top, the feedback it is made of underneath
  {id:'cdi', lab:'Customer delight (CDI)', u:'/ 10', val:b=>b.cdi, f:i1, tot:B=>i1(wavgB(B,b=>b.cdi)),
   kids:()=>[
     {lab:'Promotor (P)', u:'count', mid:true, val:b=>b.cdiP, f:v=>String(v), tot:B=>String(sumB(B,b=>b.cdiP))},
     {lab:'Passive (P)', u:'count', mid:true, val:b=>b.cdiPa, f:v=>String(v), tot:B=>String(sumB(B,b=>b.cdiPa))},
     {lab:'Detractor (D)', u:'count', mid:true, val:b=>b.cdiD, f:v=>String(v), tot:B=>String(sumB(B,b=>b.cdiD))},
     // below three feedbacks the percentage swings between 0 and 100 and means
     // nothing — the counts above it are the honest reading for that bucket
     {lab:'CDI %', u:'%', val:b=> b.cdiN>=3 ? (b.cdiP-b.cdiD)/b.cdiN*100 : null, f:i1,
      tot:B=>{ const n=sumB(B,b=>b.cdiN); return n? i1((sumB(B,b=>b.cdiP)-sumB(B,b=>b.cdiD))/n*100) : '–'; }},
   ]},
];

// ---- quarters and years ----------------------------------------------------
// Both are the month series folded up. Quarters follow the FINANCIAL year
// (Apr–Jun is Q1), because that is the year this business plans and reports in.
const FYQ = m => Math.floor(((m + 9) % 12) / 3);            // month 0-11 -> Q 0-3
const FYof = d => d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;

function foldMonths(se, months, keyOf, labelOf, subOf){
  const out = [], byKey = new Map();
  months.forEach(m=>{
    const d = pdate(m.key), k = keyOf(d);
    let g = byKey.get(k);
    if(!g){
      g = {key:k, label:labelOf(d), sub:subOf(d), days:0, sr:0, spare:0, labour:0,
           leads:0, batt:0, work:0, pres:0, closure:0, first:0, cdi:0, n:0};
      byKey.set(k, g); out.push(g);
    }
    ['sr','spare','labour','leads','batt','work','pres','days'].forEach(f=> g[f] += m[f]);
    ['closure','first','cdi'].forEach(f=> g[f] += m[f] * m.days);
    g.n++;
  });
  out.forEach(g=>{
    ['closure','first','cdi'].forEach(f=> g[f] = g.days ? g[f]/g.days : 0);
    g.attend = g.work ? g.pres/g.work*100 : 0;
  });
  return bifurcate(se, out);
}

const quarterBuckets = se => foldMonths(se, rawMonths(se, 24),
  d=> FYof(d)+'Q'+FYQ(d.getMonth()),
  d=> 'Q'+(FYQ(d.getMonth())+1),
  d=> 'FY '+String(FYof(d)).slice(2)+'–'+String(FYof(d)+1).slice(2));

const yearBuckets = se => foldMonths(se, rawMonths(se, 48),
  d=> String(FYof(d)),
  d=> 'FY '+String(FYof(d)).slice(2)+'–'+String(FYof(d)+1).slice(2),
  d=> '');

const bucketsFor = se => state.gran==='day' ? dayBuckets(se)
  : state.gran==='week' ? weekBuckets(se)
  : state.gran==='quarter' ? quarterBuckets(se)
  : state.gran==='year' ? yearBuckets(se)
  : monthBuckets(se);

/* ---- SVG chart primitives -------------------------------------------------
   No library: every chart here is a string of SVG. Marks follow the data-viz
   specs — bars capped at 24px with a 4px rounded cap and a 2px surface gap,
   2px lines with >=8px end markers ringed in the surface colour, solid hairline
   grid, a legend whenever there is more than one series and text in ink tokens
   rather than in the series colour. Every mark carries a <title>, which is the
   hover layer. */
const VW = 660;                                  // viewBox width of a half-width chart
const niceMax = v => {
  if(v<=0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), m = v/e;
  return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e;
};
const ticksOf = (max,n=4)=> Array.from({length:n+1},(_,i)=> max*i/n);
// a bar with a rounded cap and a square foot
const barPath = (x,y,w,h,r)=>{ r=Math.max(0,Math.min(r,w/2,h));
  return `M${x},${y+h}L${x},${y+r}Q${x},${y} ${x+r},${y}L${x+w-r},${y}Q${x+w},${y} ${x+w},${y+r}L${x+w},${y+h}Z`; };
const sq = (x,y,w,h)=> `M${x},${y}h${w}v${h}h${-w}Z`;
// x labels thin out rather than collide
const labelEvery = n => n<=8 ? 1 : n<=14 ? 2 : n<=22 ? 3 : Math.ceil(n/8);

function chartFrame(H, max, cats, fmtY){
  const pad = {l:44,r:52,t:12,b:28};
  const pw = VW-pad.l-pad.r, ph = H-pad.t-pad.b;
  const y = v => pad.t + ph - (v/max)*ph;
  let g = '';
  ticksOf(max).forEach(t=>{
    g += `<line x1="${pad.l}" x2="${VW-pad.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--viz-grid)" stroke-width="1"/>`
       + `<text x="${pad.l-7}" y="${(y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--viz-mut)">${fmtY(t)}</text>`;
  });
  g += `<line x1="${pad.l}" x2="${VW-pad.r}" y1="${pad.t+ph}" y2="${pad.t+ph}" stroke="var(--viz-base)" stroke-width="1"/>`;
  const step = labelEvery(cats.length), band = pw/cats.length;
  cats.forEach((c,i)=>{
    if(i%step) return;
    g += `<text x="${(pad.l+band*(i+.5)).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="10" fill="var(--viz-mut)">${esc(c)}</text>`;
  });
  return {pad, pw, ph, y, band, g};
}

// Columns — one series, or several stacked. One y axis, always.
function colChart(cats, series, opts={}){
  const H = opts.h||168;
  const totals = cats.map((_,i)=> series.reduce((a,s)=>a+(s.values[i]||0),0));
  const max = niceMax(Math.max(opts.target||0, ...totals) * 1.08) || 1;
  const F = chartFrame(H, max, cats, opts.fmtY || (v=>Math.round(v)));
  const bw = Math.min(24, Math.max(3, F.band-6));
  let m = '';
  cats.forEach((c,i)=>{
    let acc = 0;
    series.forEach((s,si)=>{
      const v = s.values[i]||0;
      if(v<=0){ acc+=v; return; }
      const y0 = F.y(acc+v), y1 = F.y(acc);
      const gap = si<series.length-1 ? 2 : 0;          // 2px surface gap in a stack
      const h = Math.max(1, y1-y0-gap);
      const x = F.pad.l + F.band*(i+.5) - bw/2;
      const top = si===series.length-1;
      m += `<path d="${top?barPath(x,y0,bw,h,4):sq(x,y0+gap,bw,h)}" fill="${s.color}">`
         + `<title>${esc(c)} · ${esc(s.name)}: ${esc(opts.fmtV?opts.fmtV(v):Math.round(v))}</title></path>`;
      acc += v;
    });
  });
  let t = '';
  if(opts.target){
    const ty = F.y(opts.target);
    t = `<line x1="${F.pad.l}" x2="${VW-F.pad.r}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--viz-ink)" stroke-width="1" stroke-dasharray="5 3" opacity=".55"/>`
      + `<text x="${VW-F.pad.r}" y="${(ty-5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--viz-mut)">${esc(opts.targetLabel||'target')}</text>`;
  }
  return `<svg viewBox="0 0 ${VW} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${F.g}${m}${t}</svg>`;
}

// Lines — every series on ONE scale, each direct-labelled at its end.
function lineChart(cats, series, opts={}){
  const H = opts.h||168;
  const max = opts.max || niceMax(Math.max(...series.flatMap(s=>s.values)) * 1.12) || 1;
  const F = chartFrame(H, max, cats, opts.fmtY || (v=>Math.round(v)));
  const px = i => F.pad.l + F.band*(i+.5);
  let m = '';
  if(opts.ref!=null){
    const ry = F.y(opts.ref);
    m += `<line x1="${F.pad.l}" x2="${VW-F.pad.r}" y1="${ry.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="var(--viz-ink)" stroke-width="1" stroke-dasharray="5 3" opacity=".55"/>`
       + `<text x="${VW-F.pad.r}" y="${(ry-5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--viz-mut)">${esc(opts.refLabel||'target')}</text>`;
  }
  series.forEach(s=>{
    const d = s.values.map((v,i)=>`${i?'L':'M'}${px(i).toFixed(1)},${F.y(v).toFixed(1)}`).join('');
    m += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{
      m += `<circle cx="${px(i).toFixed(1)}" cy="${F.y(v).toFixed(1)}" r="7" fill="transparent">`
         + `<title>${esc(cats[i])} · ${esc(s.name)}: ${esc(opts.fmtV?opts.fmtV(v):v.toFixed(1))}</title></circle>`;
    });
    const li = s.values.length-1;
    m += `<circle cx="${px(li).toFixed(1)}" cy="${F.y(s.values[li]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--viz-surf)" stroke-width="2"/>`;
  });
  // one end label per series, in ink — never in the series colour
  const li2 = cats.length-1;
  const ends = series.map(s=>({s, y0:F.y(s.values[li2]), v:s.values[li2]})).sort((a,b)=>a.y0-b.y0);
  let prev = F.pad.t;
  ends.forEach(e=>{ e.y = Math.max(e.y0, prev+11); prev = e.y; });
  ends.forEach(e=>{
    const lx = px(li2)+8;
    // a leader line, never a label floating away from its own series
    if(Math.abs(e.y-e.y0)>2)
      m += `<path d="M${(px(li2)+5).toFixed(1)},${e.y0.toFixed(1)}L${lx.toFixed(1)},${e.y.toFixed(1)}" stroke="${e.s.color}" stroke-width="1" fill="none" opacity=".7"/>`;
    m += `<text x="${(lx+2).toFixed(1)}" y="${(e.y+3.5).toFixed(1)}" font-size="9.5" fill="var(--viz-ink)" font-weight="600">${esc(opts.fmtV?opts.fmtV(e.v):e.v.toFixed(1))}</text>`;
  });
  return `<svg viewBox="0 0 ${VW} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${F.g}${m}</svg>`;
}

const lg = arr => `<span class="ch-lg">${arr.map(a=>`<span><i style="background:${a.c}"></i>${esc(a.n)}</span>`).join('')}</span>`;


/* ---- the short summary -----------------------------------------------------
   Sits between the numbers and the charts and says, in words, what the period
   actually came to: four figures, then the three or four things a branch
   manager would say out loud about this engineer. Everything in it is read off
   the buckets, so it can never drift from the table above it. */
function summaryOf(se, B){
  const T = k => B.reduce((a,b)=>a+b[k],0);
  const sr = T('sr'), pres = T('pres'), work = T('work');
  const rev = T('spare') + T('labour');
  const revT = state.targets.spare + state.targets.labour;
  const nMonths = state.gran==='month' ? B.length : (B.reduce((a,b)=>a+b.days,0)/30.4);
  const met = COMMITMENTS.filter(k=>achieve(k,se.v[k.key])>=100);
  const missed = COMMITMENTS.filter(k=>{ const a=achieve(k,se.v[k.key]); return a!=null && a<85; })
    .sort((a,b)=> achieve(a,se.v[a.key]) - achieve(b,se.v[b.key]));
  const best = COMMITMENTS.slice().sort((a,b)=> achieve(b,se.v[b.key]) - achieve(a,se.v[a.key]))[0];

  // the mix, straight off the bifurcations
  const srMix = SR_TYPES.map(t=>({t, n:B.reduce((a,b)=>a+b.srBy[t],0)})).sort((a,b)=>b.n-a.n);
  const partMix = PART_CATS.map(c=>({c, v:B.reduce((a,b)=>a+b.spareBy[c],0)})).sort((a,b)=>b.v-a.v);
  const P = T('cdiP'), Pa = T('cdiPa'), Dt = T('cdiD'), N = T('cdiN');
  const worstType = SR_TYPES.map(t=>({t, n:B.reduce((a,b)=>a+b.srBy[t],0),
      c:(()=>{ const n=B.reduce((a,b)=>a+b.srBy[t],0);
               return n? B.reduce((a,b)=>a+b.closeBy[t]*b.srBy[t],0)/n : null; })()}))
    .filter(x=>x.n>=3 && x.c!=null).sort((a,b)=>a.c-b.c)[0];

  const tile = (l,v,h,c) => `<div class="sm-t"><span class="l">${l}</span>`
    + `<span class="v"${c?` style="color:${c}"`:''}>${v}</span><span class="h">${h}</span></div>`;
  const revCol = rev >= revT*nMonths ? 'var(--pms-ok-ink)' : 'var(--pms-miss-ink)';
  const attCol = work && pres/work*100 >= state.targets.attend ? 'var(--pms-ok-ink)' : 'var(--pms-miss-ink)';

  const say = [];
  say.push(`Closed <b>${sr} SRs</b> over <b>${pres} days present</b> — `
    + `<b>${pres?(sr/pres).toFixed(2):'–'} a day present</b>, against the ${iN(state.targets.sr)}-a-month commitment `
    + `(${(state.targets.sr*nMonths).toFixed(0)} over the ${nMonths<1.02?'month':nMonths.toFixed(0)+' months'} shown).`);
  if(srMix[0] && srMix[0].n)
    say.push(`The load is mostly <b>${esc(srMix[0].t)}</b> (${Math.round(srMix[0].n/Math.max(1,sr)*100)}% of SRs)`
      + (srMix[1] && srMix[1].n ? `, then ${esc(srMix[1].t)} (${Math.round(srMix[1].n/Math.max(1,sr)*100)}%)` : '') + '.');
  say.push(`Revenue <b>₹${(rev/1e5).toFixed(2)} L</b> — spare ₹${(T('spare')/1e5).toFixed(2)} L`
    + (partMix[0] && partMix[0].v ? ` (mostly ${esc(partMix[0].c)})` : '')
    + `, labour ₹${(T('labour')/1e5).toFixed(2)} L — against ₹${(revT*nMonths/1e5).toFixed(2)} L committed.`);
  say.push(`The period holds <b>${work} working days</b> — present on <b>${pres}</b>, absent on `
    + `<b>${work-pres}</b> (${work?(pres/work*100).toFixed(1):'0'}%).`);
  say.push(`Customer feedback: <b>${P} promotor · ${Pa} passive · ${Dt} detractor</b> out of ${N}.`);
  if(worstType && worstType.c < state.targets.closure)
    say.push(`Closure is weakest on <b>${esc(worstType.t)}</b> SRs at ${worstType.c.toFixed(1)}% `
      + `against the ${state.targets.closure}% timeline.`);
  say.push(missed.length
    ? `Strongest on <b>${esc(best.short)}</b>; short on <b>${missed.slice(0,3).map(k=>esc(k.short)).join('</b>, <b>')}</b>.`
    : `Every commitment kept — strongest on <b>${esc(best.short)}</b>.`);

  return `<section class="sm-box">
    <h4>Summary <span>${esc(firstName(se.name))} · ${state.gran==='month'?'trailing 12 months':'the selected period'}</span></h4>
    <div class="sm-tiles">
      ${tile('Parameter met', met.length+' / '+COMMITMENTS.length, 'score '+se.score.toFixed(1)+' · grade '+se.grade)}
      ${tile('SR closed', iN(sr), (pres?(sr/pres).toFixed(2):'–')+' per day present')}
      ${tile('Revenue', '₹'+(rev/1e5).toFixed(2)+' L', 'committed ₹'+(revT*nMonths/1e5).toFixed(2)+' L', revCol)}
      ${tile('Present', pres+' / '+work, 'of '+work+' working days · '+(work?(pres/work*100).toFixed(1):'0')+'%', attCol)}
    </div>
    <ul class="sm-say">${say.map(x=>`<li>${x}</li>`).join('')}</ul>
  </section>`;
}

// The mirrored bar above the breakdown: same width as the table, scrolling in
// step with it, and hidden outright when the table already fits.
function syncDtBar(){
  const box = $('dtBox'), bar = $('dtTopBar'), inner = $('dtTopInner');
  if(!box || !bar || !inner || !box.getBoundingClientRect) return;
  const apply = ()=>{
    const w = box.scrollWidth, need = w > box.clientWidth + 1;
    bar.classList.toggle('hide', !need);
    inner.style.width = need ? w+'px' : '100%';
    bar.scrollLeft = box.scrollLeft;
  };
  // measured AFTER layout — read straight out of renderDetail and the table has
  // not been laid out yet, so scrollWidth comes back as the visible width and
  // the bar's thumb spans the whole strip however wide the table really is
  apply();
  requestAnimationFrame(apply);
  let lock = false;
  box.onscroll = ()=>{ if(lock) return; lock=true; bar.scrollLeft = box.scrollLeft; lock=false; };
  bar.onscroll = ()=>{ if(lock) return; lock=true; box.scrollLeft = bar.scrollLeft; lock=false; };
}
window.addEventListener('resize', syncDtBar);

/* ---- the panel itself ---------------------------------------------------- */
function openDetail(uid){
  state.openSe = uid;
  renderDetail();
  renderPanel(visibleSes());
  $('detail').scrollIntoView({behavior:'smooth', block:'start'});
}
function closeDetail(){
  state.openSe = null;
  renderDetail();
  renderPanel(visibleSes());
}

function renderDetail(){
  const se = SES.find(s=>s.uid===state.openSe);
  if(!se){
    $('detail').innerHTML = `<div class="dt-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
      <b>Pick a service engineer</b>
      <span>Choose one in the explorer above — their day, week and month report opens here,
        with the charts of how the period actually ran.</span>
    </div>`;
    return;
  }
  const B = bucketsFor(se);
  const met = COMMITMENTS.filter(k=>achieve(k,se.v[k.key])>=100).length;
  const scope = (state.gran==='day' || state.gran==='week')
    ? `${fmtDay(state.from)} – ${fmtDay(state.to)} · ${B.length} ${state.gran==='day'?'days':'weeks'}`
    : `${B.length} ${({month:'months',quarter:'quarters',year:'financial years'})[state.gran]} to `
      + `${MON[pdate(state.to).getMonth()]} ${pdate(state.to).getFullYear()}`;

  // ---- the breakdown, TRANSPOSED --------------------------------------------
  // Periods left to right across the head; every metric top to bottom down the
  // frozen side column. This table is also the relief the light-mode aqua line
  // owes under the palette's contrast rule — every plotted number is here.
  const headCells = B.map(b=>
    `<th class="${b.off?'off':''}${b.cur?' cur':''}"><b>${esc(b.label)}</b>${b.sub?`<span>${esc(b.sub)}</span>`:''}</th>`).join('');
  // A zero reads as a dash across the whole sheet: nothing happened is easier
  // to skim as an absence than as a row of 0.00s, and the eye goes to the
  // figures that ARE there.
  const cellsOf = (row, kid) => B.map(b=>{
    const html = row.cell ? row.cell(b)
      : (()=>{ const v=row.val(b); return (v==null||v===0)?'–':dashZero(row.f(v)); })();
    const raw = String(html).replace(/<[^>]*>/g,'');
    return `<td class="${b.off?'off ':''}${kid?'k ':''}${row.mid?'mid':''}" title="${esc(b.label+(b.sub?' '+b.sub:''))} · ${esc(row.lab)}: ${esc(raw)} ${esc(row.u)}">${html}</td>`;
  }).join('');
  const CH = o => `<svg class="dtc${o?' open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>`;
  const bodyRows = DT_ROWS.map(row=>{
    const kids = row.kids ? row.kids() : null;
    const open = kids && state.dtOpen.has(row.id);
