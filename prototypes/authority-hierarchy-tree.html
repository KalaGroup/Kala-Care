<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authority Matrix — Hierarchy Tree Prototype</title>
<style>
    :root{
        --brand:#2f3192; --brand-dark:#23255f; --brand-soft:rgba(47,49,146,.08);
        --line:#c7c9e0; --ink:#111827; --muted:#6b7280; --card:#ffffff; --bg:#eef0f7;
        --l5:#2f3192; --l4:#7c3aed; --l3:#0d9488; --l2:#d97706; --l1:#64748b;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }

    /* ===== modal-style shell (like the Authority Matrix box) ===== */
    .shell{ max-width:1500px; margin:18px auto; background:var(--card); border-radius:18px;
            box-shadow:0 18px 50px rgba(35,37,95,.22); overflow:hidden; display:flex; flex-direction:column; height:calc(100vh - 36px); }
    .bar{ background:linear-gradient(120deg,var(--brand) 0%,var(--brand-dark) 100%); color:#fff;
          padding:11px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .bar h1{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:9px; }
    .bar h1 svg{ flex-shrink:0; }
    .tabs{ margin-left:auto; display:flex; gap:7px; flex-wrap:wrap; }
    .tab{ border:0; cursor:pointer; padding:7px 14px; border-radius:9px; font-size:12px; font-weight:700;
          background:rgba(255,255,255,.15); color:#fff; transition:.15s; }
    .tab:hover{ background:rgba(255,255,255,.28); }
    .tab.on{ background:#fff; color:var(--brand); box-shadow:0 1px 4px rgba(0,0,0,.18); }

    /* ===== filter row ===== */
    .filters{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 18px;
              border-bottom:1px solid #e5e7eb; background:#f8f9fc; }
    .filters label{ font-size:11px; font-weight:700; color:var(--muted); }
    .filters select,.filters input{ font-size:12px; padding:6px 9px; border:1px solid #d1d5db; border-radius:9px;
              background:#fff; color:var(--ink); outline:none; min-width:150px; }
    .filters select:focus,.filters input:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
    .btn-reset{ margin-left:auto; cursor:pointer; font-size:11.5px; font-weight:700; padding:6px 13px;
                border-radius:9px; border:1px solid #d1d5db; background:#fff; color:#374151; }
    .btn-reset:hover{ background:#f3f4f6; }
    .crumb{ font-size:11.5px; color:var(--muted); padding:8px 18px 0; }
    .crumb b{ color:var(--brand); }
    .crumb a{ color:var(--brand); cursor:pointer; text-decoration:underline dotted; }

    /* ===== stage ===== */
    .stage{ flex:1; overflow:auto; padding:18px 18px 34px; }
    .stage::-webkit-scrollbar{ height:8px; width:8px; }
    .stage::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }

    /* ===== legend ===== */
    .legend{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; font-size:10.5px; color:var(--muted); }
    .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

    /* ===== org-chart tree (nested UL with connectors) ===== */
    .tree{ display:flex; justify-content:center; min-width:max-content; margin:0 auto; list-style:none; }
    .tree ul{ display:flex; justify-content:center; position:relative; padding-top:22px; list-style:none; }
    .tree ul ul::before{ content:''; position:absolute; top:0; left:50%; border-left:2px solid var(--line); height:22px; }
    .tree li{ text-align:center; position:relative; padding:22px 7px 0; }
    .tree li::before,.tree li::after{ content:''; position:absolute; top:0; right:50%; border-top:2px solid var(--line); width:50%; height:22px; }
    .tree li::after{ right:auto; left:50%; border-left:2px solid var(--line); }
    .tree li:only-child::before,.tree li:only-child::after{ display:none; }
    .tree li:only-child{ padding-top:0; }
    .tree li:first-child::before,.tree li:last-child::after{ border:0 none; }
    .tree li:last-child::before{ border-right:2px solid var(--line); border-radius:0 8px 0 0; }
    .tree li:first-child::after{ border-radius:8px 0 0 0; }
    .tree > li{ padding-top:0; }
    .tree > li::before,.tree > li::after{ display:none; }

    /* ===== cards ===== */
    .card{ display:inline-block; background:var(--card); border:1px solid #e5e7eb; border-radius:13px;
           padding:9px 13px; min-width:150px; max-width:230px; box-shadow:0 2px 8px rgba(35,37,95,.07); text-align:left; }
    .card .tag{ display:inline-block; font-size:8.5px; font-weight:800; letter-spacing:.4px; color:#fff;
                border-radius:5px; padding:2px 7px; margin-bottom:5px; text-transform:uppercase; }
    .card .nm{ font-size:12.5px; font-weight:700; line-height:1.25; }
    .card .sub{ font-size:10px; color:var(--muted); margin-top:2px; }
    .card.coo{ background:linear-gradient(120deg,var(--brand),var(--brand-dark)); border:0; }
    .card.coo .nm{ color:#fff; } .card.coo .sub{ color:rgba(255,255,255,.75); }
    .card.region{ border-top:4px solid var(--brand); cursor:default; }
    .card.branch{ border-top:4px solid var(--l4); cursor:pointer; transition:.15s; }
    .card.branch:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(35,37,95,.16); }
    .t-l5{ background:var(--l5); } .t-l4{ background:var(--l4); } .t-l3{ background:var(--l3); }
    .t-l2{ background:var(--l2); } .t-l1{ background:var(--l1); } .t-reg{ background:var(--brand); }

    .u{ cursor:pointer; font-size:11px; padding:2px 0; color:#374151; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u:hover{ color:var(--brand); text-decoration:underline dotted; }
    .u.me{ color:var(--brand); font-weight:800; }
    .u .lvl{ font-size:8.5px; font-weight:800; border-radius:4px; padding:1px 4px; color:#fff; margin-right:4px; }
    .cats{ font-size:9px; color:var(--l4); font-weight:700; margin-top:2px; }
    .chipwrap{ display:flex; flex-wrap:wrap; gap:4px; max-width:210px; margin-top:4px; }
    .chip{ cursor:pointer; font-size:10px; background:#eef2ff; color:#3730a3; padding:2px 8px; border-radius:99px;
           border:1px solid #e0e7ff; transition:.12s; white-space:nowrap; }
    .chip:hover{ background:var(--brand); color:#fff; }
    .cnt{ display:inline-block; font-size:9px; font-weight:800; background:#f3f4f6; color:#4b5563; border-radius:99px; padding:1px 7px; margin-left:5px; }

    /* ===== user-chain (vertical) ===== */
    .chain{ display:flex; flex-direction:column; align-items:center; }
    .vline{ width:2px; height:22px; background:var(--line); }
    .chain .card{ min-width:230px; max-width:330px; }
    .skip{ background:#f8f9fc !important; border-style:dashed !important; }
    .skip .nm{ color:#9ca3af; font-weight:600; font-size:11.5px; }
    .note{ font-size:10px; color:var(--muted); margin-top:3px; }
    .l4row{ display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; justify-content:center; }
    .hint{ text-align:center; font-size:10.5px; color:var(--muted); margin-top:18px; }
    .empty{ text-align:center; color:var(--muted); font-size:13px; padding:60px 0; }

    @media (max-width:640px){
        .shell{ margin:0; border-radius:0; height:100vh; }
        .filters select,.filters input{ min-width:110px; flex:1; }
    }
</style>
</head>
<body>
<div class="shell">

    <!-- ===== header bar: title + view tabs ===== -->
    <div class="bar">
        <h1>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12m0 0-5.2 5M12 12l5.2 5"/></svg>
            Authority Matrix — Hierarchy Tree <span style="font-weight:400;font-size:11px;opacity:.75">(prototype)</span>
        </h1>
        <span class="tabs" style="font-size:11px;opacity:.8">Company → Region → Branch → User — one view, click to drill down</span>
    </div>

    <!-- ===== filters ===== -->
    <div class="filters">
        <label>Region</label>
        <select id="fRegion" onchange="onRegion()"><option value="">All regions</option></select>
        <label>Branch</label>
        <select id="fBranch" onchange="onBranch()"><option value="">All branches</option></select>
        <label>User</label>
        <input id="fUser" list="userList" placeholder="Type a name…" oninput="onUser()">
        <datalist id="userList"></datalist>
        <button class="btn-reset" onclick="resetAll()">↺ Reset — full company</button>
    </div>
    <div class="crumb" id="crumb"></div>

    <!-- ===== tree canvas ===== -->
    <div class="stage">
        <div class="legend">
            <span><i style="background:var(--l5)"></i>L5 — COO</span>
            <span><i style="background:var(--l4)"></i>L4 — HOD</span>
            <span><i style="background:var(--l3)"></i>L3 — Approver</span>
            <span><i style="background:var(--l2)"></i>L2 — Approver</span>
            <span><i style="background:var(--l1)"></i>L1 — Employee</span>
        </div>
        <div id="stage"></div>
        <div class="hint">Click any <b>branch card</b> for that branch's tree · click any <b>name</b> for that user's approval chain</div>
    </div>
</div>

<script>
/* ================= DUMMY MASTER DATA (mirrors the real matrix shape) ================= */

const REGIONS = [

/* level: l1..l4 (l5 = the fixed COO). cats only meaningful on L4 (HOD). */
const USERS = [

    { id:'u05', name:'Priyanka Sunil Deokar',    branch:'420435_1', level:'l1' },
    { id:'u06', name:'Rohit Madhav Joshi',       branch:'420435_1', level:'l1' },
    { id:'u07', name:'Rahul Vishnupant Kulkarni',branch:'420435_1', level:'l2' },
    { id:'u08', name:'Sunita Ashok Kale',        branch:'420435_1', level:'l2' },

    { id:'u10', name:'Prakash Baburao Deshmukh', branch:'420435_1', level:'l4', cats:['Spares','Services'] },
    /* --- Ahilyanagar --- */
    { id:'u11', name:'Anil Dilip Sonawane',      branch:'420435_2', level:'l1' },
    { id:'u12', name:'Jyoti Mangesh Swami',      branch:'420435_2', level:'l1' },
    { id:'u13', name:'Pragati Dattatray Shinde', branch:'420435_2', level:'l1' },
    { id:'u14', name:'Mangesh Vitthal Gore',     branch:'420435_2', level:'l1' },
    { id:'u15', name:'Kavita Rajendra Tambe',    branch:'420435_2', level:'l1' },
    { id:'u16', name:'Nitin Shankar Wable',      branch:'420435_2', level:'l1' },
    { id:'u17', name:'Rahul Balasaheb Bhor',     branch:'420435_2', level:'l2' },
    { id:'u18', name:'Vikas Changdev Antre',     branch:'420435_2', level:'l3' },
    { id:'u19', name:'Meena Prabhakar Joshi',    branch:'420435_2', level:'l4', cats:['Spares'] },
    { id:'u20', name:'Sanjay Namdev Pawar',      branch:'420435_2', level:'l4', cats:['Services'] },
    /* --- Pune --- */
    { id:'u21', name:'Amol Suresh Jagtap',       branch:'420435_3', level:'l1' },
    { id:'u22', name:'Sneha Vilas Kulkarni',     branch:'420435_3', level:'l1' },
    { id:'u23', name:'Nilesh Anant Thorat',      branch:'420435_3', level:'l1' },
    { id:'u24', name:'Tejas Mohan Bhosale',      branch:'420435_3', level:'l1' },
    { id:'u25', name:'Aishwarya Deepak Ranade',  branch:'420435_3', level:'l1' },
    { id:'u26', name:'Sagar Popat Shelar',       branch:'420435_3', level:'l1' },
    { id:'u27', name:'Manisha Arun Ghule',       branch:'420435_3', level:'l1' },

    { id:'u39', name:'Manjunath Krishnappa Gowda',branch:'560001_1', level:'l1' },

    { id:'u44', name:'Pavithra Srinivas Iyer',   branch:'560001_1', level:'l1' },
    { id:'u45', name:'Prashanth Ganesh Shetty',  branch:'560001_1', level:'l2' },
    { id:'u46', name:'Divya Ramesh Hegde',       branch:'560001_1', level:'l3' },
    { id:'u47', name:'Suresh Venkatesh Rao',     branch:'560001_1', level:'l4', cats:['Spares'] },

    { id:'u49', name:'Basavaraj Shankrappa Patil',branch:'560001_2', level:'l1' },

    { id:'u51', name:'Vijayalakshmi Hanumanth Naik',branch:'560001_2', level:'l1' },
    { id:'u52', name:'Santosh Ningappa Badiger', branch:'560001_2', level:'l1' },
    { id:'u53', name:'Mahesh Chanabasappa Hiremath',branch:'560001_2', level:'l2' },
    { id:'u54', name:'Rekha Siddappa Angadi',    branch:'560001_2', level:'l3' },
    { id:'u55', name:'Anand Mallikarjun Desai',  branch:'560001_2', level:'l4', cats:['Spares','Services'] },
    /* --- Mysuru --- */
    { id:'u56', name:'Chetan Wodeyar Urs',       branch:'560001_3', level:'l1' },
    { id:'u57', name:'Rashmi Venkatesh Iyengar', branch:'560001_3', level:'l1' },
    { id:'u58', name:'Darshan Kumaraswamy Gowda',branch:'560001_3', level:'l1' },
    { id:'u59', name:'Bhavana Srikanth Achar',   branch:'560001_3', level:'l1' },
    { id:'u60', name:'Puneeth Raghavendra Shastri',branch:'560001_3', level:'l2' },
    { id:'u61', name:'Harish Devraj Kumar',      branch:'560001_3', level:'l3' },
    { id:'u62', name:'Girish Ananth Nayak',      branch:'560001_3', level:'l4', cats:['Spares','Services'] },
];

/* ================= LOOK-UPS ================= */
const LVL_NAME = { l1:'L1 — Employee', l2:'L2 — Approver', l3:'L3 — Approver', l4:'L4 — HOD', l5:'L5 — COO' };
const byBranch = c => USERS.filter(u => u.branch === c);
const atLevel  = (c,l) => byBranch(c).filter(u => u.level === l);
const branchOf = c => BRANCHES.find(b => b.code === c);
const userOf   = id => USERS.find(u => u.id === id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ================= SMALL BUILDERS ================= */
const uLine = (u, meId) => `
    <div class="u ${u.id===meId?'me':''}" onclick="event.stopPropagation();showUser('${u.id}')" title="${esc(LVL_NAME[u.level])} — click for this user's tree">
        <span class="lvl t-${u.level}">${u.level.toUpperCase()}</span>${esc(u.name)}
    </div>`;

const stageBlock = (title, cls, users, meId, extra='') => `
    <div class="card">
        <span class="tag ${cls}">${title}</span>
        ${users.length ? users.map(u => uLine(u, meId)).join('') : '<div class="u" style="color:#9ca3af;cursor:default">— none assigned —</div>'}
        ${extra}
    </div>`;

/* one full branch column: branch card → L4 → L3 → L2 → L1 chips */
function branchSubtree(code){
    const b = branchOf(code);
    const l4 = atLevel(code,'l4'), l3 = atLevel(code,'l3'), l2 = atLevel(code,'l2'), l1 = atLevel(code,'l1');
    const l4extra = l4.map(u => u.cats ? `<div class="cats">▸ ${esc(u.name.split(' ')[0])}: ${u.cats.join(' · ')}</div>` : '').join('');
    return `
    <li>
        <div class="card branch" onclick="showBranch('${code}')" title="Click — only this branch's tree">
            <span class="tag t-reg">Branch</span>
            <div class="nm">${esc(b.name)}</div>
            <div class="sub">${esc(code)} · ${byBranch(code).length} users<span class="cnt">${b.region}</span></div>
        </div>
        <ul>
            <li>
                ${stageBlock('L4 · HOD','t-l4', l4, null, l4extra)}
                <ul><li>
                    ${stageBlock('L3 · Approver','t-l3', l3, null)}
                    <ul><li>
                        ${stageBlock('L2 · Approver','t-l2', l2, null)}
                        <ul><li>
                            <div class="card">
                                <span class="tag t-l1">L1 · Employees</span>
                                <div class="chipwrap">
                                    ${l1.length ? l1.map(u => `<span class="chip" onclick="event.stopPropagation();showUser('${u.id}')">${esc(u.name)}</span>`).join('') : '<span style="font-size:10px;color:#9ca3af">— none —</span>'}
                                </div>
                            </div>
                        </li></ul>
                    </li></ul>
                </li></ul>
            </li>
        </ul>
    </li>`;
}

/* ================= VIEW 1 — COMPANY (COO → regions → branches) ================= */
function companyTree(regionFilter){
    const regions = REGIONS.filter(r => !regionFilter || r.code === regionFilter);
    return `
    <ul class="tree">
        <li>
            <div class="card coo">
                <span class="tag t-l5">L5 · COO</span>
                <div class="nm">${esc(COO.name)}</div>
                <div class="sub">${esc(COO.title)} — final authority, unlimited</div>
            </div>
            <ul>
                ${regions.map(r => {
                    const brs = BRANCHES.filter(b => b.region === r.code);
                    const cnt = brs.reduce((n,b) => n + byBranch(b.code).length, 0);
                    return `
                    <li>
                        <div class="card region">
                            <span class="tag t-reg">Region</span>
                            <div class="nm">${esc(r.name)}</div>
                            <div class="sub">${brs.length} branches · ${cnt} users</div>
                        </div>
                        <ul>${brs.map(b => branchSubtree(b.code)).join('')}</ul>
                    </li>`;
                }).join('')}
            </ul>
        </li>
    </ul>`;
}

/* ================= VIEW 2 — ONE BRANCH ================= */
function branchTree(code){
    const b = branchOf(code);
    if (!b) return '<div class="empty">Pick a branch from the filter above.</div>';
    return `
    <ul class="tree">
        <li>
            <div class="card coo">
                <span class="tag t-l5">L5 · COO</span>
                <div class="nm">${esc(COO.name)}</div>
                <div class="sub">Company-wide final approval</div>
            </div>
            <ul>${branchSubtree(code)}</ul>
        </li>
    </ul>`;
}

/* ================= VIEW 3 — ONE USER'S APPROVAL CHAIN ================= */
function userChain(id){
    const me = userOf(id);
    if (!me) return '<div class="empty">Pick a user from the filter above.</div>';
    const b = branchOf(me.branch);
    const excl = (list) => list.filter(u => u.id !== me.id);

    const stageCard = (lvl, cls, label) => {
        const people = excl(atLevel(me.branch, lvl));
        const selfIn = atLevel(me.branch, lvl).some(u => u.id === me.id);
        if (!people.length) return `
            <div class="card skip"><span class="tag ${cls}" style="opacity:.55">${label}</span>
                <div class="nm">Skipped — ${selfIn ? 'self approval removed (only approver is this user)' : 'no approver assigned'}</div>
            </div>`;
        return `
            <div class="card"><span class="tag ${cls}">${label}</span>
                ${people.map(u => uLine(u, me.id)).join('')}
                ${selfIn ? '<div class="note">⚠ own name removed — self-approval is not allowed</div>' : ''}
            </div>`;
    };

    const l4s = excl(atLevel(me.branch,'l4'));
    const l4Row = l4s.length ? `
        <div class="l4row">
            ${l4s.map(u => `
                <div class="card"><span class="tag t-l4">L4 · HOD ${u.cats ? '· '+u.cats.join(' & ') : ''}</span>
                    ${uLine(u, me.id)}
                </div>`).join('')}
        </div>`
        : `<div class="card skip"><span class="tag t-l4" style="opacity:.55">L4 · HOD</span><div class="nm">Skipped — ${atLevel(me.branch,'l4').length ? 'self approval removed' : 'no HOD assigned'}</div></div>`;

    return `
    <div class="chain">
        <div class="card" style="border-top:4px solid var(--brand)">
            <span class="tag t-${me.level}">${esc(LVL_NAME[me.level])}</span>
            <div class="nm">${esc(me.name)}</div>
            <div class="sub">${esc(b.name)} (${esc(me.branch)}) · ${b.region === 'MH' ? 'Maharashtra' : 'Karnataka'}</div>
            <div class="note">Creates the NFA — within own limit = <b>auto-approved</b>; above it the record climbs this chain ↓</div>
        </div>
        <div class="vline"></div>
        ${stageCard('l2','t-l2','L2 · Approver')}
        <div class="vline"></div>
        ${stageCard('l3','t-l3','L3 · Approver')}
        <div class="vline"></div>
        ${l4Row}
        <div class="vline"></div>
        <div class="card coo">
            <span class="tag t-l5">L5 · COO</span>
            <div class="nm">${esc(COO.name)}</div>
            <div class="sub">Final stop — unlimited authority, every record can finalize here</div>
        </div>
    </div>`;
}

/* ================= STATE + WIRING ================= */
const $ = id => document.getElementById(id);
let view = { kind:'company', region:'', branch:'', user:'' };

function crumb(html){ $('crumb').innerHTML = html; }

/* ONE view for everything: company tree by default, a branch tree when a
   branch is picked/clicked, a user chain when a user is picked/clicked. */
function render(){
    const s = $('stage');
    if (view.kind === 'company'){
        s.innerHTML = companyTree(view.region);
        const r = REGIONS.find(x => x.code === view.region);
        crumb(`Showing: <b>${r ? esc(r.name)+' region' : 'Full company hierarchy'}</b> — COO on top, region-wise → branch-wise`);
    } else if (view.kind === 'branch'){
        s.innerHTML = branchTree(view.branch);
        const b = branchOf(view.branch);
        crumb(b ? `<a onclick="resetAll()">Company</a> › <b>${esc(b.name)} (${esc(b.code)})</b> — this branch's full chain` : 'Pick a branch…');
    } else {
        s.innerHTML = userChain(view.user);
        const u = userOf(view.user);
        crumb(u ? `<a onclick="resetAll()">Company</a> › <a onclick="showBranch('${u.branch}')">${esc(branchOf(u.branch).name)}</a> › <b>${esc(u.name)}</b> — this user's approval chain` : 'Pick a user…');
    }
}

/* ---- navigation used by clicks + filters ---- */
function showCompany(){ view = { kind:'company', region:$('fRegion').value, branch:'', user:'' }; $('fBranch').value=''; $('fUser').value=''; render(); }
function showBranch(code){ view = { kind:'branch', region:view.region, branch:code, user:'' }; syncFilters(); render(); }
function showUser(id){ view = { kind:'user', region:view.region, branch:userOf(id)?.branch || '', user:id }; syncFilters(); render(); }
function resetAll(){ view = { kind:'company', region:'', branch:'', user:'' }; syncFilters(); render(); }

function syncFilters(){
    $('fRegion').value = view.region || '';
    fillBranches();
    $('fBranch').value = view.branch || '';
    $('fUser').value = view.user ? userOf(view.user).name : '';
}

/* ---- filter handlers ---- */
function onRegion(){
    view.region = $('fRegion').value;
    fillBranches();
    if (view.kind !== 'company'){ view = { kind:'company', region:view.region, branch:'', user:'' }; }
    view.branch=''; view.user=''; $('fBranch').value=''; $('fUser').value='';
    render();
}
function onBranch(){
    const c = $('fBranch').value;
    if (c) showBranch(c);
    else { view.branch=''; showCompany(); }
}
function onUser(){
    const name = $('fUser').value.trim().toLowerCase();
    const u = USERS.find(x => x.name.toLowerCase() === name);
    if (u) showUser(u.id);
}

/* ---- populate filter options ---- */
function fillBranches(){
    const sel = $('fBranch'), cur = sel.value;
    sel.innerHTML = '<option value="">All branches</option>' +
        BRANCHES.filter(b => !view.region || b.region === view.region)
            .map(b => `<option value="${b.code}">${esc(b.name)} (${b.code}) — ${b.region}</option>`).join('');
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}
(function init(){
    $('fRegion').innerHTML = '<option value="">All regions</option>' +
        REGIONS.map(r => `<option value="${r.code}">${esc(r.name)}</option>`).join('');
    fillBranches();
    $('userList').innerHTML = USERS.map(u => `<option value="${esc(u.name)}">${esc(branchOf(u.branch).name)} · ${LVL_NAME[u.level]}</option>`).join('');
    render();
})();
</script>
</body>
